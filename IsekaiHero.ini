; Isekai Hero — optional settings.
; Deploys to Data\SKSE\Plugins\IsekaiHero.ini. Delete it and the mod uses the
; defaults shown below. Values: 1/true/yes/on = enabled, anything else = disabled.

[SkillTree]
; Skill-tree nodes that need a deeper rebirth than you took (HERO / ASCENDED gifts
; on a NORMAL run) are normally shown greyed with a "requires ... rebirth" hint.
; Set this to 1 to hide those sealed nodes entirely instead.
HideSealedNodes = 0

[Hotkey]
; Which key opens the [ SYSTEM ] menu. Values are DirectInput scan codes, written in
; hex (0x1F) or decimal (31). Default: Right Shift + S.
; Set the modifier to 0 for no modifier at all (the key opens the menu on its own).
;
; Common scan codes:
;   Letters   A=0x1E B=0x30 C=0x2E D=0x20 E=0x12 F=0x21 G=0x22 H=0x23 I=0x17
;             J=0x24 K=0x25 L=0x26 M=0x32 N=0x31 O=0x18 P=0x19 Q=0x10 R=0x13
;             S=0x1F T=0x14 U=0x16 V=0x2F W=0x11 X=0x2D Y=0x15 Z=0x2C
;   Function  F1=0x3B F2=0x3C F3=0x3D F4=0x3E F5=0x3F F6=0x40 F7=0x41 F8=0x42
;             F9=0x43 F10=0x44 F11=0x57 F12=0x58
;   Modifiers LShift=0x2A RShift=0x36 LCtrl=0x1D RCtrl=0x9D LAlt=0x38 RAlt=0xB8
;   Other     Tab=0x0F CapsLock=0x3A Backslash=0x2B Grave/tilde=0x29
SystemMenuKey = 0x1F
SystemMenuModifier = 0x36
