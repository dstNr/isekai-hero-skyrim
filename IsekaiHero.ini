; Isekai Hero — optional settings.
; Deploys to Data\SKSE\Plugins\IsekaiHero.ini. Delete it and the mod uses the
; defaults shown below. Values: 1/true/yes/on = enabled, anything else = disabled.

[SkillTree]
; Skill-tree nodes that need a deeper rebirth than you took (HERO / ASCENDED gifts
; on a NORMAL run) are normally shown greyed with a "requires ... rebirth" hint.
; Set this to 1 to hide those sealed nodes entirely instead.
HideSealedNodes = 0

[Dormant]
; Only used if you picked the DORMANT blessing at rebirth: the character levels at
; which the sleeping blessing wakes to HERO and then to ASCENDED. Changing these
; affects a running save — lower them and the awakening you have already earned
; arrives on the next load.
DormantHeroLevel = 25
DormantAscendedLevel = 80

[Storage]
; The storage codex — an inventory item meant to be "drunk" like a potion to open the
; Dimensional Storage without the System menu, as a fallback for anyone whose hotkey or
; panel does not work (Skyrim VR most of all).
;
; UNFINISHED, and off by default because of it: the item is handed out and it carries the
; SAME name as the storage container itself, but drinking it does not open anything yet.
; All it does today is sit in your inventory looking like a stray copy of the chest.
;
; While this is 0 the codex is never handed out, and one you already carry is taken back
; on the next load. Set it to 1 to keep it anyway.
StorageCodex = 0

[SkyrimNet]
; EXPERIMENTAL / UNTESTED. Optional integration with SkyrimNet (AI-driven NPCs). Not yet
; verified in a running game with SkyrimNet; it does nothing at all unless SkyrimNet is
; present, so it is safe to leave on. When SkyrimNet is installed,
; the mod tells it who you are — reincarnated by the System, your tier, the milestones
; you earn — so AI NPCs can react to the isekai premise. Does nothing unless SkyrimNet
; is present. Set to 0 if you run SkyrimNet but want no System context fed into it.
SkyrimNetIntegration = 1

[Hotkey]
; Which key opens the [ SYSTEM ] menu. Every key setting below takes either a NAME
; (S, F11, Tab, RShift) or a DirectInput scan code in hex (0x1F) or decimal (31).
; Default: Right Shift + S.
; Set the modifier to 0 for no modifier at all (the key opens the menu on its own).
;
; Common scan codes:
;   Letters   A=0x1E B=0x30 C=0x2E D=0x20 E=0x12 F=0x21 G=0x22 H=0x23 I=0x17
;             J=0x24 K=0x25 L=0x26 M=0x32 N=0x31 O=0x18 P=0x19 Q=0x10 R=0x13
;             S=0x1F T=0x14 U=0x16 V=0x2F W=0x11 X=0x2D Y=0x15 Z=0x2C
;   Function  F1=0x3B F2=0x3C F3=0x3D F4=0x3E F5=0x3F F6=0x40 F7=0x41 F8=0x42
;             F9=0x43 F10=0x44 F11=0x57 F12=0x58
;   Modifiers LShift=0x2A RShift=0x36 LCtrl=0x1D RCtrl=0x9D LAlt=0x38 RAlt=0xB8
;   Other     Tab=0x0F CapsLock=0x3A Backslash=0x2B Grave/tilde=0x29
SystemMenuKey = 0x1F
SystemMenuModifier = 0x36

[Threat]
; The System's read on what is in front of you, floating over the actor itself:
; TRIVIAL / MANAGEABLE / DANGEROUS / LETHAL, colour-coded, from the level difference
; between it and you. Always on — it used to cost a skill-tree node and a key press,
; which is backwards for something you want to know BEFORE you commit to a fight.
;
; SE/AE only. It is drawn by the same overlay as the mod's menus, which Skyrim VR
; does not get.
ThreatLabels = 1

; Which actors get a label:
;   hostile    enemies only — hostile to you, or already fighting you (default)
;   all        everything alive that is not you or a follower, townspeople included
;   crosshair  only what you are currently looking at
ThreatLabelTargets = hostile

; How far away an actor may be and still be labelled, in game units (~70 per metre).
; Beyond this the label is dropped rather than shrunk into an unreadable smudge.
; Clamped to 500..20000.
ThreatLabelRange = 4000

; The self-test checks that the ESP's forms resolve, that every quest target keyword
; exists in your load order, that the shop can deliver what it advertises, that the
; interface art is on disk and that the crafting hooks installed — then writes a
; PASS/FAIL report to IsekaiHeroSKSE.log.
;
; It runs BY ITSELF a moment after every game load, so a bug report never needs this
; setting: just send the log. Set a KEY here only if you want to re-run it on demand,
; mid-session — e.g. right after buying something, to see where it landed.
;
;   SelfTestKey = F11      <- this is what you want
;   SelfTestKey = 0        <- off (the default)
;
; NOT a 0/1 switch, unlike most settings in this file. It takes a key, and "1" is not
; "on" — it is the scan code for ESCAPE, which would run the self-test every time you
; open the pause menu. The mod refuses ESC and Tab for that reason and says so in the
; log. Names (F11, F10, V, Tab...) and scan codes (0x57) both work.
SelfTestKey = 0

; Diagnostic only, for a hotkey that does nothing. Logs which input DEVICE and SCAN CODE
; each button press arrives under, so the log can show whether the key reaches the mod at
; all. Only device 0 (keyboard) drives hotkeys — Skyrim VR sends controller buttons as
; device 5 or 6, which are ignored.
;
; What this does and does not do, since the question is fair: the mod reads Skyrim's own
; input events from inside the running game (no Windows keyboard hook, no polling, no raw
; input), and records only a device number and a scan code — nothing translates a scan
; code into a character. It does mean keys typed into a game text field appear as scan
; codes, which is why it is off by default and stops itself after 200 presses per session.
;
; 0 = off (the default).
LogInputDiagnostics = 0
