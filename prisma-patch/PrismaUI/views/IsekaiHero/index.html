  } else {
    const d = document.createElement("div"); d.className = "trow mono empty";
    d.textContent = "No deeds recognised yet.";
    tl.appendChild(d);
  }

  buildStatusActions();
}

window.isekaiShowStatus = (data) => {
  try { STATUS = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("status");
  renderStatus();
};

/* ---------------- SYSTEM SHOP ---------------- */
let SHOP = { points: 0, shelves: [], items: [] };
let SHELF = 0;   // which category the rail has selected; survives a re-push after buying

// Closing resets the rail, so the shop always opens on the first shelf; a purchase
// re-pushes the catalog without closing, and there the selection has to survive.
function shopClose() { SHELF = 0; callBack("isekaiShopClose", ""); }
function shopBuy(i) { callBack("isekaiShopBuy", String(i)); }

/* Rebuilt wholesale on every push: the catalog is a handful of cards, and each purchase
   re-pushes it anyway (the balance and every card's affordability change at once).

   The card index handed to shopBuy is the item's position in the FULL catalog, not in
   the filtered shelf — that index is what Shop::Buy() resolves against, and renumbering
   per shelf would buy whatever happens to sit at that offset in the whole list. */
function renderShop() {
  $("shPoints").textContent = SHOP.points;

  const shelves = SHOP.shelves && SHOP.shelves.length ? SHOP.shelves : [];
  SHELF = Math.max(0, Math.min(SHELF, shelves.length - 1));

  const rail = $("shRail");
  rail.innerHTML = "";
  shelves.forEach((name, z) => {
    const held = (SHOP.items || []).filter((it) => it.shelf === name).length;
    const row = document.createElement("div");
    row.className = "shelf mono" + (z === SHELF ? " on" : "");
    row.innerHTML = esc(name) + "<b>" + held + "</b>";
    row.addEventListener("click", () => { SHELF = z; renderShop(); });
    rail.appendChild(row);
  });
  rail.classList.toggle("hidden", shelves.length < 2);

  const active = shelves[SHELF];
  const grid = $("shGrid");
  grid.innerHTML = "";

  const visible = (SHOP.items || [])
    .map((it, i) => ({ it, i }))
    .filter(({ it }) => !active || it.shelf === active);

  if (!visible.length) {
    const msg = document.createElement("div");
    msg.className = "shEmpty mono";
    msg.textContent = (SHOP.items || []).length ? "Nothing on this shelf yet."
                                                : "The catalog is empty.";
    grid.appendChild(msg);
    return;
  }

  visible.forEach(({ it, i }) => {
    const afford = SHOP.points >= it.cost;
    const card = document.createElement("div");
    card.className = "card" + (afford ? " can" : " cant");

    if (it.icon) {
      const img = document.createElement("img");
      img.src = "icons/" + it.icon;
      img.onerror = () => { img.style.display = "none"; };
      card.appendChild(img);
    }

    const nm = document.createElement("div");
    nm.className = "cName mono";
    nm.textContent = it.name;
    card.appendChild(nm);

    if (it.qty) {
      const q = document.createElement("div");
      q.className = "cQty mono";
      q.textContent = it.qty;
      card.appendChild(q);
    }

    const cost = document.createElement("div");
    cost.className = "cCost mono";
    cost.innerHTML = it.cost + "<span>SP</span>";
    card.appendChild(cost);

    const btn = document.createElement("button");
    btn.className = "btn mono";
    btn.textContent = afford ? "Buy" : "Locked";
    if (afford) btn.addEventListener("click", () => shopBuy(i));
    card.appendChild(btn);

    grid.appendChild(card);
  });
}

window.isekaiShowShop = (data) => {
  try { SHOP = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("shop");
  renderShop();
};

/* ---------------- LEVEL-UP FLOURISH ---------------- */
/* The burst layer (rays + sparks) is built once and reused. Each element carries its own
   angle / distance / delay as custom properties, so one keyframe can fling them all out
   individually instead of in lockstep. */
function buildBurst() {
  const box = $("fSparks");
  if (box.childElementCount) return;

  const RAYS = 10;
  for (let i = 0; i < RAYS; i++) {
    const r = document.createElement("div");
    r.className = "ray";
    r.style.setProperty("--a", (i * (180 / RAYS) + Math.random() * 8).toFixed(1) + "deg");
    r.style.setProperty("--rd", (Math.random() * 0.07).toFixed(3) + "s");
    box.appendChild(r);
  }

  const SPARKS = 16;
  for (let i = 0; i < SPARKS; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.setProperty("--a", (i * (360 / SPARKS) + Math.random() * 14 - 7).toFixed(1) + "deg");
    s.style.setProperty("--d", (170 + Math.random() * 190).toFixed(0) + "px");
    s.style.setProperty("--sd", (Math.random() * 0.18).toFixed(2) + "s");
    box.appendChild(s);
  }
}

/* Each glyph becomes its own span so the title can land letter by letter. */
function setFlourishTitle(a_text) {
  const el = $("fTitle");
  el.innerHTML = "";
  [...a_text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = "ltr";
    s.textContent = ch === " " ? " " : ch;
    s.style.animationDelay = (i * 0.038).toFixed(3) + "s";
    el.appendChild(s);
  });
}

window.isekaiFlourish = (data) => {
  let d = {}; try { d = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) {}
  setFlourishTitle(d.title || "");
  $("fSub").textContent = d.subtitle || "";
  buildBurst();
  showScreen("flourish");
  const el = $("screen-flourish");
  el.classList.remove("play"); void el.offsetWidth; el.classList.add("play");
};

/* ---------------- shared ---------------- */
function callBack(name, arg) { if (window[name]) window[name](arg); }
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

window.addEventListener("resize", () => {
  fitTree();
  if ($("screen-tree").classList.contains("active")) renderTree();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("screen-tree").classList.contains("active")) { closeTree(); return; }
  if ($("screen-shop").classList.contains("active")) { shopClose(); return; }
  if ($("screen-status").classList.contains("active")) { statusAction("close"); return; }
  if ($("screen-panel").classList.contains("active")) {
    const tb = textButtons();
    if (tb.length === 1) choose(PANEL.buttons.indexOf(tb[0]));
  }
});
fitTree();
</script>
