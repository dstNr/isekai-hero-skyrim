<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isekai Hero — System UI</title>
<style>
  :root {
    --bg:      rgba(5, 13, 26, 0.94);
    --accent:  #59ccff;
    --text:    #d9f0ff;
    --dim:     #80a6c7;
    --amber:   #c8965a;
    --locked:  #2c3a47;
    --node:    64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none;
      font-family: Consolas, "Courier New", monospace; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  .screen { position: fixed; inset: 0; display: none;
            align-items: center; justify-content: center; }
  .screen.active { display: flex; }
  .backdrop { position: fixed; inset: 0;
              background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.7)); }

  /* Shared framed-panel chrome. */
  .framed { position: relative; background: var(--bg);
            border: 1px solid rgba(89,204,255,0.35);
            box-shadow: 0 0 24px rgba(89,204,255,0.15), inset 0 0 60px rgba(89,204,255,0.04); }
  .bracket { position: absolute; width: 26px; height: 26px;
             border: 2px solid var(--accent); opacity: 0.85; }
  .bracket.tl { top: 10px;    left: 10px;    border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 10px;    right: 10px;   border-left: 0;  border-bottom: 0; }
  .bracket.bl { bottom: 10px; left: 10px;    border-right: 0; border-top: 0; }
  .bracket.br { bottom: 10px; right: 10px;   border-left: 0;  border-top: 0; }

  .accent { color: var(--accent); text-shadow: 0 0 12px rgba(89,204,255,0.5); }

  /* ======================= SKILL TREE ======================= */
  #stage { width: 1120px; height: 760px; transform: scale(var(--scale, 1));
           transform-origin: center center; }
  #tTitle { position: absolute; top: 20px; left: 0; right: 0; text-align: center;
            letter-spacing: 3px; font-size: 22px; }
  #tSep { position: absolute; top: 58px; left: 24px; right: 24px; height: 1px;
          background: rgba(89,204,255,0.4); }
  .theader { position: absolute; left: 28px; font-size: 15px; letter-spacing: 1px; }
  #hPoints { top: 70px; color: var(--accent); }
  #hPerks  { top: 94px; color: var(--dim); }
  #canvas { position: absolute; top: 70px; left: 0; width: 1120px; height: 620px; }
  #lines  { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .node { position: absolute; width: var(--node); height: var(--node);
          margin-left: calc(var(--node) / -2); margin-top: calc(var(--node) / -2);
          background: var(--bg); border: 2px solid var(--locked);
          display: flex; align-items: center; justify-content: center;
          transition: transform 0.08s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
  .node img { width: 100%; height: 100%; object-fit: contain;
              filter: grayscale(0.7) brightness(0.4); transition: filter 0.2s ease; }
  .node.owned   { border-color: var(--accent);
                  box-shadow: 0 0 14px rgba(89,204,255,0.55), inset 0 0 8px rgba(89,204,255,0.25); }
  .node.owned   img { filter: none; }
  .node.buyable { border-color: var(--accent); cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  .node.buyable img { filter: grayscale(0.1) brightness(0.95); }
  .node.poor    { border-color: var(--dim); }
  .node.poor    img { filter: grayscale(0.4) brightness(0.65); }
  .node.sealed  { border-color: var(--amber); border-style: dashed; }
  .node.sealed  img { filter: grayscale(0.85) brightness(0.4) sepia(0.4); }
  .node.locked  { border-color: var(--locked); }
  .node:hover   { transform: scale(1.12); outline: 1px solid var(--text); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 6px rgba(89,204,255,0.35); }
                     50%     { box-shadow: 0 0 18px rgba(89,204,255,0.85); } }
  .rank { position: absolute; bottom: -6px; right: -6px; min-width: 18px; height: 18px;
          padding: 0 4px; background: var(--bg); border: 1px solid var(--accent);
          color: var(--accent); font-size: 11px; line-height: 16px; text-align: center; }

  #tInfo { position: absolute; left: 28px; bottom: 24px; width: 620px; }
  #tName   { color: var(--accent); font-size: 17px; letter-spacing: 1px; }
  #tDesc   { color: var(--text); font-size: 14px; margin-top: 6px; white-space: pre-line; line-height: 1.4; }
  #tStatus { font-size: 14px; margin-top: 12px; letter-spacing: 1px; }

  .btn { background: transparent; color: var(--text); border: 1px solid var(--accent);
         letter-spacing: 3px; cursor: pointer; }
  .btn:hover  { background: rgba(89,204,255,0.18); }
  .btn:active { background: rgba(89,204,255,0.35); }
  #tClose { position: absolute; right: 24px; bottom: 20px; width: 170px; height: 42px; font-size: 15px; }

  /* ======================= DIALOG PANEL ======================= */
  #panel { min-height: 220px; padding: 30px 34px 26px; display: flex; flex-direction: column;
           transform: scale(var(--pscale, 1)); transform-origin: center center; }
  #pTitle { text-align: center; letter-spacing: 3px; font-size: 22px; }
  #pSep { margin: 14px 0 18px; height: 1px; background: rgba(89,204,255,0.4); }
  #pBody { color: var(--text); font-size: 16px; line-height: 1.5; white-space: pre-wrap;
           flex: 1; min-height: 60px; }
  #pButtons { display: flex; gap: 14px; margin-top: 26px; }
  #pButtons .btn { flex: 1; height: 46px; font-size: 15px; display: flex; align-items: center;
                   justify-content: center; gap: 10px; }
  #pButtons .btn img { width: 30px; height: 30px; object-fit: contain; }
  #pIcons { position: absolute; top: 70px; right: 22px; display: flex; flex-direction: column; gap: 12px; }
  .iconBtn { width: 76px; height: 76px; background: transparent; border: 1px solid transparent;
             cursor: pointer; position: relative; }
  .iconBtn img { width: 100%; height: 100%; object-fit: contain; }
  .iconBtn:hover { border-color: var(--accent); }
  .iconBtn .lbl { position: absolute; right: 84px; top: 50%; transform: translateY(-50%);
                  color: var(--accent); white-space: nowrap; opacity: 0; transition: opacity 0.15s; font-size: 14px; }
  .iconBtn:hover .lbl { opacity: 1; }

  /* ======================= LEVEL-UP FLOURISH ======================= */
  #screen-flourish { pointer-events: none;
                     background: radial-gradient(ellipse at center, transparent 55%, rgba(89,204,255,0.10) 100%); }
  #flourish { text-align: center; }
  #fTitle { font-size: 60px; letter-spacing: 6px; color: var(--accent);
            text-shadow: 0 0 30px rgba(89,204,255,0.8); }
  #fSub   { font-size: 22px; letter-spacing: 4px; color: var(--text); margin-top: 10px; }
  #screen-flourish.play #fTitle { animation: punch 0.45s cubic-bezier(.2,1.4,.3,1) both; }
  #screen-flourish.play #fSub   { animation: fadeup 0.6s ease-out 0.25s both; }
  #screen-flourish.play .ring   { animation: ring 1.4s ease-out both; }
  #screen-flourish.play #flourish { animation: fadeout 0.5s ease-in 1.9s both; }
  .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
          border: 2px solid rgba(89,204,255,0.7); border-radius: 50%; opacity: 0; }
  .ring.r2 { animation-delay: 0.18s !important; }
  .ring.r3 { animation-delay: 0.36s !important; }
  @keyframes punch  { 0% { transform: scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeup { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes ring   { 0% { transform: scale(0.2); opacity: 0.8; } 100% { transform: scale(22); opacity: 0; } }
  @keyframes fadeout{ to { opacity: 0; } }
</style>
</head>
<body>
  <!-- SKILL TREE -->
  <div id="screen-tree" class="screen">
    <div class="backdrop"></div>
    <div id="stage" class="framed">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="tTitle" class="accent">[ SYSTEM ] SKILL TREE</div>
      <div id="tSep"></div>
      <div class="theader" id="hPoints">SYSTEM POINTS   —</div>
      <div class="theader" id="hPerks">PERK POINTS     —</div>
      <div id="canvas"><svg id="lines" viewBox="0 0 1120 620" preserveAspectRatio="none"></svg></div>
      <div id="tInfo"><div id="tName"></div><div id="tDesc"></div><div id="tStatus"></div></div>
      <button id="tClose" class="btn" onclick="closeTree()">CLOSE</button>
    </div>
  </div>

  <!-- DIALOG PANEL -->
  <div id="screen-panel" class="screen">
    <div class="backdrop"></div>
    <div id="panel" class="framed">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="pTitle" class="accent"></div>
      <div id="pSep"></div>
      <div id="pBody"></div>
      <div id="pIcons"></div>
      <div id="pButtons"></div>
    </div>
  </div>

  <!-- LEVEL-UP FLOURISH -->
  <div id="screen-flourish" class="screen">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div id="flourish"><div id="fTitle"></div><div id="fSub"></div></div>
  </div>

<script>
"use strict";
const CANVAS_TOP = 70;
const $ = (id) => document.getElementById(id);

function showScreen(name) {
  ["tree", "panel", "flourish"].forEach(s =>
    $("screen-" + s).classList.toggle("active", s === name));
}

/* ---------------- SKILL TREE ---------------- */
let TREE = { points: 0, perks: 0, perkMax: 255, nodes: [] };
const byKey = new Map();

function fitTree() {
  const s = Math.min(window.innerWidth / 1120, window.innerHeight / 760);
  document.documentElement.style.setProperty("--scale", s.toFixed(4));
}
function stateOf(n) {
  if (n.owned) return "owned";
  const reachable = n.prereqMet && n.tierMet;
  if (reachable && TREE.points >= n.cost) return "buyable";
  if (reachable) return "poor";
  if (!n.tierMet) return "sealed";
  return "locked";
}
function statusText(n) {
  const rankTag = n.repeatable
    ? "   RANK " + n.rank + (n.maxRank > 0 ? " / " + n.maxRank : "") : "";
  if (n.repeatable && n.maxRank > 0 && n.rank >= n.maxRank)
    return { text: "MAXED" + rankTag, col: "var(--accent)" };
  if (n.owned) return { text: "UNLOCKED", col: "var(--accent)" };
  if (!n.tierMet) return { text: "SEALED — requires " + n.reqPower + " rebirth", col: "var(--amber)" };
  if (!n.prereqMet) return { text: "LOCKED — requires a connected node", col: "var(--dim)" };
  const afford = TREE.points >= n.cost;
  return { text: "COST   " + n.cost + " system point(s)" + rankTag,
           col: afford ? "var(--accent)" : "#dc5a5a" };
}
function treeInfo(n) {
  $("tName").textContent = n ? n.name : "";
  $("tDesc").textContent = n ? n.desc : "";
  const el = $("tStatus");
  if (!n) { el.textContent = ""; return; }
  const s = statusText(n); el.textContent = s.text; el.style.color = s.col;
}
function renderTree() {
  $("hPoints").textContent = "SYSTEM POINTS   " + TREE.points;
  $("hPerks").textContent = "PERK POINTS     " + TREE.perks + " / " + TREE.perkMax;
  const canvas = $("canvas");
  [...canvas.querySelectorAll(".node")].forEach(e => e.remove());
  const svg = $("lines"); svg.innerHTML = "";
  byKey.clear(); TREE.nodes.forEach(n => byKey.set(n.key, n));

  TREE.nodes.forEach(n => (n.prereq || []).forEach(pk => {
    if (!pk) return;
    const from = byKey.get(pk); if (!from) return;
    const lit = from.owned && n.owned ? 0.85 : from.owned ? 0.4 : 0.15;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", from.x); line.setAttribute("y1", from.y - CANVAS_TOP);
    line.setAttribute("x2", n.x);    line.setAttribute("y2", n.y - CANVAS_TOP);
    line.setAttribute("stroke", "rgba(89,204,255," + lit + ")");
    line.setAttribute("stroke-width", from.owned && n.owned ? 2.5 : 1.5);
    svg.appendChild(line);
  }));

  TREE.nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node " + stateOf(n);
    el.style.left = n.x + "px"; el.style.top = (n.y - CANVAS_TOP) + "px";
    const img = document.createElement("img");
    img.src = "icons/" + n.icon; img.onerror = () => { img.style.display = "none"; };
    el.appendChild(img);
    if (n.repeatable && n.rank > 0) {
      const pip = document.createElement("div"); pip.className = "rank"; pip.textContent = n.rank; el.appendChild(pip);
    }
    el.addEventListener("mouseenter", () => treeInfo(n));
    el.addEventListener("mouseleave", () => treeInfo(null));
    el.addEventListener("click", () => { if (stateOf(n) === "buyable") callBack("isekaiBuy", String(n.key)); });
    canvas.appendChild(el);
  });
}
window.isekaiShowTree = (data) => {
  try { TREE = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("tree"); fitTree(); renderTree();
};
function closeTree() { callBack("isekaiCloseTree", ""); }

/* ---------------- DIALOG PANEL ---------------- */
let PANEL = { title: "", body: "", reveal: 45, width: 720, buttons: [] };
let panelRAF = 0, panelStart = 0, buttonsShown = false;

function fitPanel() {
  const s = Math.min(1, window.innerWidth / (PANEL.width + 120), window.innerHeight / 900);
  document.documentElement.style.setProperty("--pscale", s.toFixed(4));
  $("panel").style.width = PANEL.width + "px";
}
function textButtons() { return PANEL.buttons.filter(b => !b.iconOnly); }

function buildButtons() {
  const row = $("pButtons"); row.innerHTML = "";
  const icons = $("pIcons"); icons.innerHTML = "";
  PANEL.buttons.forEach((b, i) => {
    if (b.iconOnly) {
      const el = document.createElement("button");
      el.className = "iconBtn";
      el.innerHTML = '<span class="lbl">' + escapeHtml(b.label) + '</span>' +
                     (b.icon ? '<img src="icons/' + b.icon + '">' : "");
      el.onclick = () => choose(i);
      icons.appendChild(el);
    } else {
      const el = document.createElement("button");
      el.className = "btn";
      el.innerHTML = (b.icon ? '<img src="icons/' + b.icon + '">' : "") + escapeHtml(b.label);
      el.onclick = () => choose(i);
      row.appendChild(el);
    }
  });
  row.style.visibility = "hidden";  // revealed once the body finishes typing
}
function tickPanel(now) {
  if (!panelStart) panelStart = now;
  const elapsed = (now - panelStart) / 1000;
  const shown = Math.floor(elapsed * PANEL.reveal);
  const done = shown >= PANEL.body.length;
  $("pBody").textContent = done ? PANEL.body : (PANEL.body.slice(0, shown) + "_");
  if (done && !buttonsShown) { buttonsShown = true; $("pButtons").style.visibility = "visible"; }
  if (!done) panelRAF = requestAnimationFrame(tickPanel);
}
window.isekaiShowPanel = (data) => {
  try { PANEL = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("panel");
  $("pTitle").textContent = PANEL.title;
  buildButtons();
  fitPanel();
  cancelAnimationFrame(panelRAF); panelStart = 0; buttonsShown = false;
  $("pBody").textContent = "";
  panelRAF = requestAnimationFrame(tickPanel);
};
function choose(i) { callBack("isekaiChoose", String(i)); }

/* ---------------- LEVEL-UP FLOURISH ---------------- */
window.isekaiFlourish = (data) => {
  let d = {}; try { d = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) {}
  $("fTitle").textContent = d.title || "";
  $("fSub").textContent = d.subtitle || "";
  showScreen("flourish");
  const el = $("screen-flourish");
  el.classList.remove("play"); void el.offsetWidth;  // restart the CSS animations
  el.classList.add("play");
};

/* ---------------- shared ---------------- */
function callBack(name, arg) { if (window[name]) window[name](arg); }
function escapeHtml(s) { return (s || "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

window.addEventListener("resize", () => { fitTree(); fitPanel(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("screen-tree").classList.contains("active")) { closeTree(); return; }
  if ($("screen-panel").classList.contains("active")) {
    const tb = textButtons();
    if (tb.length === 1) choose(PANEL.buttons.indexOf(tb[0]));  // dismissable single-button panel
  }
});
</script>
</body>
</html>
