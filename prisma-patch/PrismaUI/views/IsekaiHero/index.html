<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isekai Hero — System UI</title>
<style>
  :root {
    /* Palette — deep void navy + system cyan, with a warm "sealed" accent. */
    --void:      #04070e;
    --surface:   rgba(9, 18, 33, 0.86);
    --surface-2: rgba(14, 26, 44, 0.72);
    --accent:    #5ad2ff;
    --accent-dk: #1b7fb0;
    --text:      #e2f2ff;
    --dim:       #8aa8c4;
    --amber:     #e0a860;
    --danger:    #ff6b6b;
    --line:      rgba(90, 210, 255, 0.28);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    /* The icon problem, and its two halves.
       The art is transparent-backed but DARK-BODIED — a navy silhouette with cyan edge
       light, averaging about a fifth of full brightness. On a navy panel only the edges
       survived and every icon read as a few floating strokes.
       --icon-plate is what goes BEHIND: a few shades lighter than the panel, so the dark
       body has something to be dark against. It is the only half the built-in renderer
       can do (ImGui's image tint multiplies — it darkens, never lifts), so both renderers
       use it and stay recognisably the same UI.
       --icon-lift is the half only a browser can do: contrast() pulls the near-blacks up
       off the floor, brightness() carries the whole thing, and the cyan drop-shadow traces
       the silhouette in light. Applied on top of the plate, not instead of it. */
    --icon-plate: linear-gradient(165deg, rgba(108,158,205,0.30), rgba(38,62,94,0.18));
    --icon-lift:  contrast(0.86) brightness(1.30)
                  drop-shadow(0 0 5px rgba(90,210,255,0.45))
                  drop-shadow(0 1px 1px rgba(0,0,0,0.55));
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none;
      -webkit-font-smoothing: antialiased; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
               font-family: "Segoe UI", Inter, system-ui, sans-serif; color: var(--text); }
  .mono { font-family: Consolas, "SF Mono", "Roboto Mono", monospace; }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  /* Backdrop: vignette + faint scanlines, so the game reads as "behind glass". */
  /* Lighter centre so the scene shows through the (now translucent) panel; the vignette
     still darkens the edges to keep focus on the window. */
  /* Perf: one vignette radial (dropped the extra centre-glow radial and the scanline
     layer). PrismaUI renders on the CPU and struggles with many gradients/shadows/masks
     (see its Limitations page), so the whole view was thinned out to fewer heavy layers. */
  .backdrop { position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(2,5,10,0.30), rgba(2,5,10,0.74));
    animation: veilIn 0.35s var(--ease) both; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Shared glass surface ---------- */
  /* NOTE: deliberately no backdrop-filter. A full-screen blur is re-computed every
     frame in Ultralight and was the main source of the stutter in the System menu.
     Instead the surface is simply translucent (~0.82) — the scene shows through a
     little, which reads as "glass" and costs nothing. */
  /* Perf: a single flat surface colour instead of two stacked gradients, the frame is
     now the box-shadow's 1px cyan ring (was a mask-composite ::before — masks are the
     most expensive thing the CPU renderer does), and two shadows instead of four (kept
     the ring + the big drop; dropped the mid glow and the inset highlight). */
  .glass {
    position: relative;
    background: rgba(11, 22, 39, 0.86);
    box-shadow:
      0 0 0 1px rgba(90,210,255,0.30),
      0 24px 70px rgba(0,0,0,0.6);
    animation: riseIn 0.42s var(--ease) both;
  }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px) scale(0.985); }
                      to   { opacity: 1; transform: none; } }

  /* Where the controller currently is. Loud on purpose: on a pad there is no cursor to
     look for, so if this is subtle the screen is unusable. */
  .padfocus { outline: 2px solid var(--accent) !important; outline-offset: 2px;
              box-shadow: 0 0 14px rgba(90, 210, 255, .55) !important; }

  .bracket { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--accent);
             opacity: 0.9; pointer-events: none; }
  .bracket.tl { top: 9px; left: 9px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 9px; right: 9px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; }

  .eyebrow { color: var(--accent); letter-spacing: 0.34em; text-transform: uppercase;
             text-shadow: 0 0 18px rgba(90,210,255,0.55); }

  /* Static section rule. A shine used to sweep across this forever (animation: sweep
     … infinite). Ultralight (PrismaUI's renderer) has no idle short-cut for such
     animations the way a real browser's compositor does: any never-ending animation
     keeps the whole view repainting every frame, which is the main cause of the
     in-game FPS drop while the UI is open. The gradient line alone reads just as well
     and lets the page go fully idle when nothing is happening. */
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent); }

  /* Buttons */
  .btn { position: relative; background: linear-gradient(180deg, rgba(90,210,255,0.10), rgba(90,210,255,0.03));
         color: var(--text); border: 1px solid rgba(90,210,255,0.45); letter-spacing: 0.2em;
         cursor: pointer; overflow: hidden; transition: all 0.22s var(--ease);
         text-transform: uppercase; font-weight: 600; }
  /* Perf: one inset glow on hover instead of a large outer 22px-blur shadow (the outer
     blur re-rasterises a big area every hover frame). */
  .btn:hover { border-color: var(--accent); color: #fff;
               box-shadow: inset 0 0 20px rgba(90,210,255,0.16);
               transform: translateY(-1px); }
  .btn:active { transform: translateY(0); box-shadow: inset 0 0 26px rgba(90,210,255,0.25); }
  .btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -50%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
                transition: left 0.5s var(--ease); }
  .btn:hover::after { left: 130%; }

  /* ======================= SKILL TREE ======================= */
  /* Fixed-coordinate graph (node x/y come from the plugin), so the stage is a design
     canvas scaled to fit — clamped so it never fills the whole screen. */
  #stage { width: 1120px; height: 760px; flex: none;
           transform: scale(var(--scale, 1)); transform-origin: center center;
           padding: clamp(18px, 1.6vw, 26px); display: flex; flex-direction: column; }

  #tHead { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
  #tTitle { font-size: 21px; }
  #tChips { display: flex; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
          background: rgba(90,210,255,0.07); border: 1px solid rgba(90,210,255,0.25);
          font-size: 13px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
  .chip b { color: var(--accent); font-size: 15px; letter-spacing: 0.04em; }
  .chip i { width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent); font-style: normal; }

  #tRule { margin: 12px 0 0; }
  #canvas { position: relative; flex: 1; margin-top: 4px; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  /* Unlocked paths get a wide translucent halo plus a bright core line — reads as a
     glow without a per-line filter (cheap). Solid strokes throughout: a gradient on a
     <line> has a degenerate bounding box and renders black. */
  .lnk { stroke-linecap: round; fill: none; }
  .lnk.halo { stroke: rgba(90,210,255,0.22); stroke-width: 8; }
  .lnk.on   { stroke: #9fe6ff; stroke-width: 2.4; }
  .lnk.half { stroke: rgba(90,210,255,0.5);  stroke-width: 1.7; }
  .lnk.off  { stroke: rgba(125,165,200,0.22); stroke-width: 1.2; }

  /* Mastery rail: the repeatable stats don't hang off the branch graph, so they get
     their own labelled dock on the left. Rows, not bare icons — a column of unlabelled
     tiles read as a toolbar rather than as part of the tree, so each row now carries the
     stat's name and its tier progress next to the icon. */
  #urail { position: absolute; left: 0; top: 0; bottom: 0; width: 206px;
           display: flex; flex-direction: column; padding: 2px 8px 0 2px;
           background: linear-gradient(90deg, rgba(90,210,255,0.05), transparent);
           border-right: 1px solid rgba(90,210,255,0.14); }
  #urailHead { color: var(--dim); font-size: 10px; letter-spacing: 0.32em;
               text-transform: uppercase; opacity: 0.75; padding-left: 6px; }
  /* Bounded and scrollable: the mastery list keeps growing, and a column that simply
     gets taller eventually runs off the fixed-height stage (it did). */
  #urailNodes { flex: 1; display: flex; flex-direction: column; gap: 5px;
                padding: 8px 4px 4px 2px; overflow-y: auto; overflow-x: hidden;
                scrollbar-width: thin; }
  #urailNodes::-webkit-scrollbar { width: 4px; }
  #urailNodes::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }

  /* One mastery row: icon | name over tier bar. The row itself carries the hover/buy
     affordances, so .node inside it stays a plain tile. */
  .mrow { display: flex; align-items: center; gap: 9px; padding: 5px 7px; border-radius: 8px;
          border: 1px solid transparent; transition: all 0.2s var(--ease); }
  .mrow:hover { border-color: rgba(90,210,255,0.4); background: rgba(90,210,255,0.07); }
  .mrow.buyable { cursor: pointer; border-color: rgba(90,210,255,0.3); }
  .mrow.owned   { border-color: rgba(255,225,140,0.35); background: rgba(255,225,140,0.05); }
  .mrow.poor    { opacity: 0.6; }
  .mrow .node.docked { position: relative; margin: 0; width: 38px; height: 38px;
                       flex: none; border-radius: 7px; animation: none; }
  .mrow .node.docked .rank { display: none; }   /* the row shows the tier instead */
  .mBody { min-width: 0; flex: 1; }
  .mName { font-size: 11px; color: var(--text); letter-spacing: 0.04em;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mMeta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  /* Ten pips, one per rank, grouped visually into the five tiers by the gap. Sized so
     the whole row (icon + name + pips + tier tag) fits the rail without the tag being
     clipped — it read as "2 S" instead of "2 SP" when the pips were wider. */
  .mPips { display: flex; gap: 1px; flex: none; }
  .mPips i { width: 5px; height: 4px; border-radius: 1px; background: rgba(125,165,200,0.25); }
  .mPips i.on { background: var(--accent); box-shadow: 0 0 5px rgba(90,210,255,0.6); }
  .mPips i.sep { margin-right: 2px; }
  .mTier { font-size: 9px; letter-spacing: 0.1em; color: var(--dim); margin-left: auto;
           white-space: nowrap; flex: none; }
  .mTier.t5 { color: #fff; text-shadow: 0 0 8px rgba(255,225,140,0.8); }

  /* Zone framing: a soft tinted box with a header behind each branch, so MIGHT /
     SHADOW / ARCANA / CORE read as deliberate groups instead of one spider web. Drawn
     under the connection lines, which is why it is its own layer. */
  #zones { position: absolute; inset: 0; pointer-events: none; }
  .zone { position: absolute; border-radius: 14px; border: 1px solid rgba(90,210,255,0.10);
          background: linear-gradient(180deg, rgba(90,210,255,0.045), rgba(90,210,255,0.012)); }
  .zone.z-might   { border-color: rgba(224,138,96,0.16);
                    background: linear-gradient(180deg, rgba(224,138,96,0.055), rgba(224,138,96,0.012)); }
  .zone.z-arcana  { border-color: rgba(150,130,255,0.18);
                    background: linear-gradient(180deg, rgba(150,130,255,0.06), rgba(150,130,255,0.012)); }
  .zone.z-shadow  { border-color: rgba(120,200,180,0.16);
                    background: linear-gradient(180deg, rgba(120,200,180,0.055), rgba(120,200,180,0.012)); }
  .zoneName { position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
              padding: 1px 10px; font-size: 9px; letter-spacing: 0.34em; white-space: nowrap;
              color: var(--dim); background: #0a1420; border-radius: 10px; }
  .zone.z-might  .zoneName { color: #e0a860; }
  .zone.z-arcana .zoneName { color: #a99cff; }
  .zone.z-shadow .zoneName { color: #86ccb8; }

  /* Size comes from --ns (the node's Node::scale, in px), so the hub, the capstone and
     the Omniscience gifts read as landmarks rather than as another leaf tile. */
  .node { position: absolute; width: var(--ns, 62px); height: var(--ns, 62px);
          margin: calc(var(--ns, 62px) / -2) 0 0 calc(var(--ns, 62px) / -2);
          border-radius: 10px; display: flex; align-items: center; justify-content: center;
          background: var(--icon-plate), linear-gradient(160deg, rgba(12,22,38,0.95), rgba(9,17,30,0.95));
          border: 1px solid rgba(120,150,180,0.22);
          transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
          animation: nodeIn 0.4s var(--ease) both; }

  /* Always-on name under each graph node. Hovering for a tooltip to find out what any
     of 15 identical dark tiles even is was the single biggest readability problem.

     The width is load-bearing, not cosmetic — LABEL_W below must match it. A label is
     wider than the tile it belongs to, so it is the label, not the tile, that decides
     how far a node reaches: at 104px it overhung the zone frame, sat in the corridor
     its own child links use, and left 15px to the neighbouring band. 88px is the
     widest that still clears all three (see the layout note in SkillTree.cpp), and it
     still holds "Omniscience" and "Alchemical" on one line. */
  .nlabel { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
            width: 88px; text-align: center; font-size: 10px; line-height: 1.25;
            letter-spacing: 0.05em; color: var(--dim); pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); transition: color 0.25s var(--ease); }
  .node.owned   .nlabel { color: var(--accent); }
  .node.buyable .nlabel { color: var(--text); }
  .node.sealed  .nlabel { color: rgba(224,168,96,0.75); }
  .node.locked  .nlabel,
  .node.poor    .nlabel { color: rgba(138,168,196,0.5); }
  @keyframes nodeIn { from { opacity: 0; transform: scale(0.75); } to { opacity: 1; transform: scale(1); } }
  .node img { width: 78%; height: 78%; object-fit: contain;
              filter: grayscale(0.8) brightness(0.42); transition: filter 0.25s var(--ease); }

  .node.owned { border-color: rgba(90,210,255,0.9);
    box-shadow: 0 0 0 1px rgba(90,210,255,0.35), 0 0 26px rgba(90,210,255,0.42), inset 0 0 20px rgba(90,210,255,0.16); }
  .node.owned img { filter: var(--icon-lift); }
  .node.owned::after { content: ""; position: absolute; inset: -1px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(90,210,255,0.16), transparent 60%); pointer-events: none; }

  /* Affordable cue — STATIC. This ring used to pulse forever (animation: pulse …
     infinite), and with many buyable nodes on screen that kept Ultralight repainting
     the whole view every frame (transform/opacity is compositor-cheap in a browser,
     but Ultralight re-rasters regardless) — the main FPS drain while the tree is open.
     A steady double ring plus the brighter border and box-shadow still make affordable
     nodes pop, and now the page can idle. The cue lives on ::before so swapping the
     node's state class never restarts the entrance animation (no blink on purchase). */
  .node.buyable { border-color: rgba(90,210,255,0.85); cursor: pointer;
                  box-shadow: 0 0 15px rgba(90,210,255,0.32); }
  .node.buyable img { filter: grayscale(0.05) contrast(0.9) brightness(1.18); }
  .node.buyable::before { content: ""; position: absolute; inset: -3px; border-radius: 13px;
    border: 1.5px solid rgba(90,210,255,0.75); pointer-events: none; }

  .node.poor   { border-color: rgba(138,168,196,0.4); }
  .node.poor   img { filter: grayscale(0.5) brightness(0.7); }

  /* Sealed (gated by a deeper rebirth): an amber-lit tile behind a fine diagonal
     hatch, like something locked away — replaces the plain dashed border. Static. */
  .node.sealed { border-color: rgba(224,168,96,0.5);
                 box-shadow: inset 0 0 18px rgba(224,168,96,0.12), 0 0 10px rgba(224,168,96,0.10); }
  .node.sealed img { filter: grayscale(0.9) brightness(0.42) sepia(0.4); opacity: 0.82; }
  .node.sealed::after { content: ""; position: absolute; inset: 0; border-radius: 10px;
    pointer-events: none;
    background: repeating-linear-gradient(135deg, rgba(224,168,96,0.13) 0 1px, transparent 1px 8px); }

  .node.locked { opacity: 0.5; }

  .node:hover { transform: scale(1.16) translateY(-2px); border-color: #fff; z-index: 5;
                box-shadow: 0 0 16px rgba(90,210,255,0.55), 0 8px 18px rgba(0,0,0,0.5); }

  /* Scoped to .node on purpose. Unscoped, this rule also caught the status screen's
     System Rank chip (it carried a "rank" class too) and pinned it to the bottom-right
     corner of the status card, where it sat unnoticed until the chip gained an emblem.
     Keep the selector specific: "rank" is too generic a word to own globally. */
  .node .rank { position: absolute; bottom: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px;
          background: linear-gradient(180deg, #0d2033, #071522); border: 1px solid var(--accent);
          border-radius: 6px; color: var(--accent); font-size: 11px; font-weight: 700;
          line-height: 18px; text-align: center; box-shadow: 0 0 12px rgba(90,210,255,0.45); }

  /* Mastery tiers (Novice..Grandmaster): the rank pip climbs through a warm bronze ->
     gold escalation instead of just a number ticking up — a visible sense of
     progress independent of the node's owned/buyable state. */
  .rank.tier1 { border-color: rgba(190,140,90,0.8); color: #d9ac7c;
                box-shadow: 0 0 10px rgba(190,140,90,0.35); }
  .rank.tier2 { border-color: rgba(200,170,110,0.85); color: #e3c88f;
                box-shadow: 0 0 12px rgba(200,170,110,0.4); }
  .rank.tier3 { border-color: rgba(224,168,96,0.9); color: var(--amber);
                box-shadow: 0 0 14px rgba(224,168,96,0.5); }
  .rank.tier4 { border-color: rgba(240,200,110,0.95); color: #f5d27a;
                box-shadow: 0 0 16px rgba(240,200,110,0.6); }
  .rank.tier5 { border-color: #fff; color: #fff; background: linear-gradient(180deg, #3a2f10, #1a1508);
                box-shadow: 0 0 20px rgba(255,225,140,0.75); }

  /* Floating tooltip card next to the hovered node. */
  #tip { position: absolute; width: 300px; padding: 14px 16px; pointer-events: none; opacity: 0;
         transform: translateY(6px); transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
         background: linear-gradient(180deg, rgba(11,22,38,0.97), rgba(7,15,27,0.97));
         border: 1px solid rgba(90,210,255,0.35); border-radius: 10px; z-index: 20;
         box-shadow: 0 18px 44px rgba(0,0,0,0.65), 0 0 24px rgba(26,110,160,0.3); }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tipName { color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  #tipDesc { color: var(--text); font-size: 13px; line-height: 1.5; margin-top: 7px; white-space: pre-line; opacity: 0.9; }
  #tipStatus { font-size: 12px; margin-top: 11px; letter-spacing: 0.12em; font-weight: 600; text-transform: uppercase; }

  #tFoot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #tHint { color: var(--dim); font-size: 12px; letter-spacing: 0.16em; opacity: 0.7; }
  #tActions { display: flex; gap: 12px; }
  #tActions .btn { padding: 12px 30px; font-size: 13px; }
  /* Respec is amber, not cyan — it takes something away rather than granting it. */
  #tRespec { border-color: rgba(224,168,96,0.5); }
  #tRespec:hover { border-color: var(--amber);
                   box-shadow: inset 0 0 18px rgba(224,168,96,0.14); }
  #tRespec.armed { border-color: var(--amber); color: #fff;
                   box-shadow: inset 0 0 18px rgba(224,168,96,0.28); }
  #tRespec.hidden { display: none; }

  /* ======================= SYSTEM SHOP =======================
     Its own screen rather than the generic dialog panel with text buttons: a shop
     needs to show what you are buying, at what price, and whether you can afford it,
     all at once. Static (no running animations) so the view idles like the rest. */
  #shopCard { width: min(860px, 92vw); max-height: 88vh; padding: clamp(20px, 2.4vw, 34px);
              display: flex; flex-direction: column; gap: clamp(12px, 1.4vw, 18px); }
  #shHead { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
  #shTitle { font-size: clamp(17px, 1.45vw, 23px); }

  /* Category rail down the left, cards to the right. Eighteen cards in one flat grid
     was a wall — the eye had nowhere to start. A rail (rather than tabs across the top)
     matches the skill tree's mastery dock and can carry each shelf's count without the
     header turning into a row of text. */
  /* Fixed height, so switching shelf never resizes the window — the grid scrolls
     instead. A card area that grows and shrinks under the cursor reads as a glitch. */
  #shBody { display: flex; gap: clamp(14px, 1.6vw, 22px); min-height: 0;
            height: clamp(320px, 52vh, 560px); }
  #shRail { display: flex; flex-direction: column; gap: 2px; flex: none;
            width: clamp(140px, 15vw, 186px);
            border-right: 1px solid rgba(90,210,255,0.14); padding-right: clamp(10px, 1.2vw, 16px); }
  .shelf { display: flex; align-items: center; justify-content: space-between; gap: 10px;
           padding: 11px 12px; border-left: 3px solid transparent; cursor: pointer;
           color: var(--dim); font-size: 12px; letter-spacing: 0.16em;
           transition: color 0.2s var(--ease), background 0.2s var(--ease),
                       border-color 0.2s var(--ease); }
  .shelf b { font-weight: 400; color: rgba(138,168,196,0.6); font-size: 11px;
             letter-spacing: 0.1em; }
  .shelf:hover { color: var(--text); background: rgba(90,210,255,0.05); }
  .shelf.on { color: var(--accent); background: rgba(90,210,255,0.10);
              border-left-color: var(--accent); }
  .shelf.on b { color: var(--accent); opacity: 0.7; }

  #shGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            align-content: start; gap: clamp(10px, 1.2vw, 16px);
            overflow-y: auto; padding: 2px; flex: 1; min-width: 0; }
  #shGrid::-webkit-scrollbar { width: 5px; }
  #shGrid::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }
  /* A shelf can legitimately be empty — the potions only appear once their ESP records
     exist — so say so rather than leaving a blank panel. */
  #shGrid .shEmpty { grid-column: 1 / -1; color: var(--dim); font-size: 12px;
                     letter-spacing: 0.12em; opacity: 0.7; padding: 30px 4px; }

  .card { display: flex; flex-direction: column; align-items: center; gap: 9px;
          padding: clamp(14px, 1.6vw, 20px) 12px; border-radius: 4px;
          background: var(--surface-2); border: 1px solid var(--line);
          transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease); }
  .card img { width: 62px; height: 62px; object-fit: contain; filter: var(--icon-lift);
              background: var(--icon-plate); border-radius: 4px; padding: 4px; }
  .cName { font-size: 13px; color: var(--text); letter-spacing: 0.06em; text-align: center; }
  .cQty  { font-size: 11px; color: var(--dim); letter-spacing: 0.16em; }
  .cCost { font-size: 17px; color: var(--accent); letter-spacing: 0.04em; margin-top: 2px; }
  .cCost span { font-size: 10px; color: var(--dim); letter-spacing: 0.2em; margin-left: 4px; }
  .card .btn { width: 100%; padding: 9px 0; font-size: 12px; }

  /* Affordable stands out; unaffordable is visibly out of reach but still readable,
     so the price still tells you what to save up for. */
  .card.can { border-color: rgba(90,210,255,0.4); box-shadow: 0 0 16px rgba(90,210,255,0.12); }
  .card.can:hover { border-color: var(--accent); box-shadow: 0 0 24px rgba(90,210,255,0.28); }
  .card.cant { opacity: 0.5; }
  .card.cant .cCost { color: var(--danger); }
  .card.cant .btn { pointer-events: none; border-color: rgba(138,168,196,0.3); color: var(--dim); }

  #shFoot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  #shHint { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; opacity: 0.75; }
  /* Match the skill tree's footer buttons — the default .btn padding left this one
     visibly cramped next to the cards' full-width Buy buttons. */
  #shClose { padding: 12px 34px; font-size: 13px; flex: none; }

  /* ======================= DIALOG PANEL ======================= */
  #panel { width: min(var(--pw, 720px), 92vw); max-height: 88vh;
           padding: clamp(24px, 2.4vw, 40px); display: flex; flex-direction: column; }
  #pTitle { font-size: clamp(17px, 1.45vw, 23px); text-align: center; }
  #pRule { margin: 16px 0 20px; }
  #pBody { color: var(--text); font-size: clamp(14px, 1.02vw, 17px); line-height: 1.65;
           white-space: pre-wrap; overflow-y: auto; flex: 1; opacity: 0.94; }
  /* Row labels and standalone headings, coloured from the text's own shape — see
     colouriseBody(). Values keep #pBody's own colour, so the thing you opened the panel
     to read is the bright one. */
  #pBody .lbl { color: var(--accent); }
  #pBody .head { color: var(--accent); letter-spacing: 0.06em; }
  #pBody::-webkit-scrollbar { width: 5px; }
  #pBody::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }
  /* The panel's button row. Icon ABOVE label, not beside it.
     Side by side, the widest row the mod has — the five blessing choices — could not
     fit: at one fifth of the panel each, a 26px icon plus a letter-spaced "ASCENDED"
     is wider than the button, and since .btn clips its overflow the label ran under
     the icon and off the edge. Stacking gives the label the button's full width, and
     costs nothing on the two- and three-button rows (a single child in a column is a
     single child in a row).
     min-width: 0 is what actually lets a flex item shrink below its content width;
     without it the row overflows the panel instead of the button. */
  #pButtons { display: flex; gap: 12px; margin-top: clamp(18px, 2vw, 30px); }
  #pButtons .btn { flex: 1 1 0; min-width: 0; min-height: 48px;
                   font-size: clamp(11px, 0.8vw, 14px); letter-spacing: 0.12em;
                   display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 7px; padding: 11px 8px; }
  #pButtons .btn img { width: 28px; height: 28px; object-fit: contain;
                       filter: var(--icon-lift); background: var(--icon-plate);
                       border-radius: 3px; padding: 2px; }
  /* Last line of defence: a label longer than any button gets an ellipsis rather than
     silently disappearing under the frame. */
  #pButtons .btn .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                        white-space: nowrap; }

  #pIcons { position: absolute; top: clamp(70px, 6vw, 92px); right: clamp(16px, 1.4vw, 24px);
            display: flex; flex-direction: column; gap: 12px; }
  .iconBtn { width: 70px; height: 70px; border-radius: 12px; cursor: pointer; position: relative;
             background: var(--icon-plate);
             border: 1px solid rgba(90,210,255,0.28); transition: all 0.22s var(--ease); }
  /* Was brightness(0.92): the art was being DIMMED on the darkest surface in the UI. */
  .iconBtn img { width: 76%; height: 76%; object-fit: contain; filter: var(--icon-lift); }
  .iconBtn:hover { border-color: var(--accent); transform: translateX(-3px) scale(1.05);
                   box-shadow: inset 0 0 18px rgba(90,210,255,0.18); }
  .iconBtn:hover img { filter: var(--icon-lift) brightness(1.12); }
  .iconBtn .lbl { position: absolute; right: 82px; top: 50%; transform: translateY(-50%) translateX(6px);
                  color: var(--accent); white-space: nowrap; opacity: 0; font-size: 12px;
                  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
                  transition: all 0.22s var(--ease); text-shadow: 0 0 14px rgba(90,210,255,0.6); }
  .iconBtn:hover .lbl { opacity: 1; transform: translateY(-50%) translateX(0); }

  /* ======================= STATUS LEDGER =======================
     A dedicated dashboard for the System status, in place of dumping the plugin's
     monospace body into the generic panel. All static (no running animations) so the
     view idles like the tree does. */
  .hidden { display: none !important; }

  #statCard { width: clamp(460px, 60vw, 840px); max-height: 88vh; border-radius: 4px;
              display: flex; flex-direction: column; gap: clamp(12px, 1.4vw, 18px);
              padding: clamp(20px, 2.4vw, 34px); }
  /* Header: the tier block on the left, the Skill Tree / Storage icon buttons stacked
     on the right — the same iconBtn look the dialog panel uses, which reads nicely here
     too. Flex (not absolute) so they never collide with the tier name or the brackets. */
  #sHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  #sHeadText { min-width: 0; }
  #sIcons { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  #sTierRow { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  #sTier { font-size: clamp(26px, 3.4vw, 44px); font-weight: 700; letter-spacing: 0.1em;
           color: #fff; text-shadow: 0 0 22px rgba(90,210,255,0.5); }
  .badge { padding: 3px 11px; border: 1px solid var(--line); border-radius: 20px;
           font-size: 11px; letter-spacing: 0.2em; color: var(--accent); align-self: center; }
  .badge.dormant { color: var(--amber); border-color: rgba(224,168,96,0.5); }
  /* System Rank, as a block under the tier rather than a chip beside it. The header row
     is as tall as the three icon buttons opposite it, which left a band of dead space
     under the tier name; the rank is the one thing on this screen that earns it. It also
     lets the insignia be drawn at a size where it is actually legible — as a chip it was
     22px, which is smaller than the art is designed for.
     If the PNG is missing the img hides itself and the letter carries the meaning. */
  #sRankBlock { display: flex; align-items: center; gap: clamp(10px, 1.1vw, 16px);
                margin-top: clamp(14px, 1.8vw, 24px); }
  #sRankIcon { width: clamp(44px, 4.4vw, 62px); height: clamp(44px, 4.4vw, 62px);
               object-fit: contain; flex: none;
               filter: var(--icon-lift); }
  #sRankText { min-width: 0; }
  /* Type only — no colour. The rank ramp below is class-based, and an id selector beats
     a class every time: `color: #fff` here meant every rank rendered white however
     carefully the ramp was tuned. The .rank-* class always gets set (renderStatus falls
     back to rank-e), so nothing here has to carry a default. */
  #sRankLetter { font-size: clamp(22px, 2.6vw, 34px); font-weight: 700; line-height: 1.1;
                 letter-spacing: 0.12em; }

  /* The rank ramp: steel through the System's cyan to gold, the order every ranked game
     has trained people to read without a legend. White for all six said only "here is a
     letter" — the letter is a fact you have to look up, the colour is one you feel.
     These six MUST match Style::RankColor in the built-in renderer; the two screens
     showing the same character a different colour would be worse than neither having any,
     so tools/check.mjs compares them. */
  .rank-s { color: #ffd659; text-shadow: 0 0 20px rgba(255,214,89,0.45); }
  .rank-a { color: #c78fff; text-shadow: 0 0 20px rgba(199,143,255,0.45); }
  .rank-b { color: #73ffbd; text-shadow: 0 0 20px rgba(115,255,189,0.40); }
  .rank-c { color: #59ccff; text-shadow: 0 0 20px rgba(89,204,255,0.40); }
  .rank-d { color: #a3c7e6; text-shadow: 0 0 18px rgba(163,199,230,0.30); }
  .rank-e { color: #80a6c7; text-shadow: 0 0 18px rgba(128,166,199,0.25); }
  #sAwaken { color: var(--amber); font-size: 12px; letter-spacing: 0.1em; margin-top: 6px; }
  #sCustom { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; margin-top: 6px; }
  #sCustom b { color: var(--accent); font-weight: 600; }

  #sTiles { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.2vw, 16px); }
  .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;
          padding: clamp(12px, 1.4vw, 18px); }
  .tLabel { color: var(--dim); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; }
  .tVal { margin-top: 8px; font-size: clamp(20px, 2.4vw, 30px); color: var(--text); }
  .tVal b { color: var(--accent); }
  .tVal span { color: var(--dim); font-size: 0.6em; }
  .bar { margin-top: 11px; height: 5px; background: rgba(90,210,255,0.14); border-radius: 3px;
         overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0;
           background: linear-gradient(90deg, var(--accent-dk), var(--accent)); }

  .sect { font-size: 11px; margin-bottom: 8px; }

  /* The standing System objective: one line, with the same bar the milestone tile uses
     so the two read as the same kind of progress. */
  #sQuest { padding: 9px 12px; border: 1px solid var(--line); border-radius: 3px;
            background: rgba(90,210,255,0.05); }
  #sQuestRow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #sQuestText { font-size: 13px; color: var(--text); letter-spacing: 0.04em; }
  #sQuestCount { font-size: 12px; color: var(--accent); white-space: nowrap; }
  #sQuestCount span { color: var(--dim); margin-left: 8px; }
  #sQuest .bar { margin-top: 8px; }

  #sAtt { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .att { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px;
         border: 1px solid var(--line); border-radius: 3px; background: rgba(90,210,255,0.05);
         font-size: 13px; }
  .att .aName { color: var(--dim); }
  .att b { color: var(--accent); }

  #sTitleSect { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* flex:1 + min-height:0 are BOTH needed: without min-height:0 a flex item keeps its
     full content height (min-height:auto), so with all ~79 titles the list would grow
     past the card instead of scrolling inside it. This is what keeps the menu bounded. */
  #sTitles { flex: 1; min-height: 0; overflow-y: auto;
             display: flex; flex-direction: column; gap: 4px; padding-right: 6px; }
  #sTitles::-webkit-scrollbar { width: 5px; }
  #sTitles::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }
  .trow { display: grid; grid-template-columns: 1.1fr 1.2fr 1fr; gap: 10px; padding: 8px 12px;
          border-left: 2px solid var(--line); background: rgba(9,18,33,0.4); font-size: 12.5px; }
  .trow .tName { color: var(--accent); }
  .trow .tEff { color: var(--text); }
  .trow .tQuest { color: var(--dim); text-align: right; }
  .trow.empty { grid-template-columns: 1fr; color: var(--dim); }

  #sFoot { border-top: 1px solid var(--line); padding-top: clamp(12px, 1.4vw, 18px); }
  #sActions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  #sActions .btn { padding: 10px 22px; font-size: 13px; }
  #sActions .btn.amber { border-color: rgba(224,168,96,0.5); color: var(--amber); }
  #sActions .btn.amber:hover { border-color: var(--amber); color: #fff;
                               box-shadow: inset 0 0 18px rgba(224,168,96,0.16); }
  #sActions .btn.amber.armed { border-color: var(--amber); color: #fff;
                               background: rgba(224,168,96,0.14); }

  /* ======================= LEVEL-UP FLOURISH =======================
     This plays over LIVE gameplay (the view is shown without focus, nothing is paused),
     so every layer animates transform/opacity ONLY — no width (forces layout) and no
     filter/blur (forces a re-raster), which the earlier version still did. */
  #screen-flourish { pointer-events: none; }
  #flourish { text-align: center; position: relative; }

  /* 1 — impact flash */
  #fFlash { position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse 55% 45% at 50% 50%,
                rgba(200,245,255,0.55), rgba(90,210,255,0.16) 42%, transparent 72%); }

  /* 2 — a shaft of light rising behind the text.
     Radial gradients ONLY: a linear-gradient fades along one axis but stays solid to the
     element's left and right edges, which showed up as a hard-edged rectangle early in
     the animation. Ellipses fall off in every direction, so there is no edge to see. */
  #fPillar { position: absolute; left: 50%; top: 50%; width: 520px; height: 380px;
    margin: -190px 0 0 -260px; opacity: 0;
    background: radial-gradient(ellipse 26% 62% at 50% 50%, rgba(170,238,255,0.34), transparent 70%),
                radial-gradient(ellipse 44% 100% at 50% 50%, rgba(90,210,255,0.20), transparent 72%); }

  /* 2b — a burst of light rays through the centre */
  .ray { position: absolute; left: 50%; top: 50%; width: 3px; height: 200px;
         margin: -100px 0 0 -1.5px; opacity: 0; transform-origin: 50% 50%;
         background: linear-gradient(180deg, transparent, rgba(165,235,255,0.85) 50%, transparent); }

  /* 3 — shockwaves: two rings and a diamond, staggered */
  .ring { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
          border: 2px solid rgba(90,210,255,0.7); border-radius: 50%; opacity: 0; }
  .ring.dia { border-radius: 0; border-color: rgba(200,245,255,0.55); }

  /* 4 — sparks; angle/distance/delay come from JS as custom properties */
  #fSparks { position: absolute; inset: 0; }
  .spark { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px;
           border-radius: 50%; background: #bdefff; box-shadow: 0 0 9px var(--accent); opacity: 0; }

  /* 5 — the title slams in letter by letter (each glyph is its own span) */
  #fTitleWrap { position: relative; display: inline-block; }
  .fT { font-size: clamp(38px, 4.6vw, 76px); font-weight: 800; letter-spacing: 0.16em;
        white-space: nowrap; }
  #fTitle { color: #fff;
            text-shadow: 0 0 14px #fff, 0 0 44px var(--accent), 0 0 95px var(--accent-dk); }
  .ltr { display: inline-block; opacity: 0; }

  #fSub { font-size: clamp(14px, 1.3vw, 22px); letter-spacing: 0.42em; color: var(--accent);
          margin-top: 16px; text-transform: uppercase; text-shadow: 0 0 22px rgba(90,210,255,0.7); }
  #fBar { height: 1px; width: 320px; margin: 22px auto 0; transform: scaleX(0); opacity: 0;
          background: linear-gradient(90deg, transparent, var(--accent), transparent); }

  /* --- timeline (everything is done by ~2.2s; the plugin hides the view at 2.4s) --- */
  #screen-flourish.play #fFlash   { animation: flash 0.5s ease-out both; }
  #screen-flourish.play #fPillar  { animation: pillar 1.6s var(--ease) both; }
  #screen-flourish.play .ray      { animation: ray 0.9s ease-out both; animation-delay: var(--rd); }
  #screen-flourish.play .ring     { animation: ring 1.5s ease-out both; }
  #screen-flourish.play .r2       { animation-delay: 0.15s !important; }
  #screen-flourish.play .r3       { animation-delay: 0.62s !important; }
  #screen-flourish.play .dia      { animation: ringDia 1.7s ease-out 0.28s both; }
  #screen-flourish.play .spark    { animation: spark 1.1s ease-out both; animation-delay: var(--sd); }
  #screen-flourish.play .ltr      { animation: ltrIn 0.5s cubic-bezier(.16,1.5,.3,1) both; }
  #screen-flourish.play #fSub     { animation: fadeup 0.55s var(--ease) 0.34s both; }
  #screen-flourish.play #fBar     { animation: bar 0.7s var(--ease) 0.4s both; }
  #screen-flourish.play #flourish { animation: fadeout 0.6s ease-in 1.8s both; }

  @keyframes flash   { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pillar  { 0% { opacity: 0; transform: scaleY(0.12); }
                       20% { opacity: 1; transform: scaleY(1); }
                       100% { opacity: 0; transform: scaleY(1.08); } }
  @keyframes ring    { 0% { transform: scale(0.2); opacity: 0.9; }
                       100% { transform: scale(26); opacity: 0; } }
  @keyframes ringDia { 0% { transform: rotate(45deg) scale(0.2); opacity: 0.75; }
                       100% { transform: rotate(45deg) scale(20); opacity: 0; } }
  @keyframes spark   { 0% { opacity: 1; transform: rotate(var(--a)) translateX(24px) scale(1); }
                       100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(0.35); } }
  @keyframes ray     { 0% { opacity: 0; transform: rotate(var(--a)) scaleY(0.12); }
                       22% { opacity: 0.95; }
                       100% { opacity: 0; transform: rotate(var(--a)) scaleY(2.6); } }
  @keyframes ltrIn   { 0% { opacity: 0; transform: translateY(-30px) scale(1.9) rotate(-7deg); }
                       55% { opacity: 1; }
                       100% { opacity: 1; transform: none; } }
  @keyframes fadeup  { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bar     { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; transform: scale(1.05); } }
</style>
</head>
<body>
  <!-- SKILL TREE -->
  <div id="screen-tree" class="screen">
    <div class="backdrop"></div>
    <div id="stage" class="glass">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="tHead">
        <div id="tTitle" class="eyebrow mono">System · Skill Tree</div>
        <div id="tChips">
          <div class="chip mono"><i></i>System Points <b id="hPoints">—</b></div>
          <div class="chip mono"><i></i>Perk Points <b id="hPerks">—</b></div>
        </div>
      </div>
      <div id="tRule" class="rule"></div>
      <div id="canvas">
        <div id="urail">
          <div id="urailHead" class="mono">Mastery</div>
          <div id="urailNodes"></div>
        </div>
        <div id="zones"></div>
        <svg id="lines"></svg>
        <div id="tip"><div id="tipName"></div><div id="tipDesc"></div><div id="tipStatus"></div></div>
      </div>
      <div id="tFoot">
        <div id="tHint" class="mono">Click a glowing node to unlock · ESC to close</div>
        <div id="tActions">
          <button id="tRespec" class="btn mono" onclick="respecClick()"></button>
          <button id="tClose" class="btn mono" onclick="closeTree()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- DIALOG PANEL -->
  <div id="screen-panel" class="screen">
    <div class="backdrop"></div>
    <div id="panel" class="glass">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="pTitle" class="eyebrow mono"></div>
      <div id="pRule" class="rule"></div>
      <div id="pBody" class="mono"></div>
      <div id="pIcons"></div>
      <div id="pButtons"></div>
    </div>
  </div>

  <!-- STATUS LEDGER -->
  <div id="screen-status" class="screen">
    <div class="backdrop"></div>
    <div id="statCard" class="glass">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="sHead">
        <div id="sHeadText">
          <div class="eyebrow mono">System · Status</div>
          <div id="sTierRow">
            <div id="sTier" class="mono">—</div>
            <div id="sMode" class="badge mono hidden"></div>
          </div>
          <div id="sAwaken" class="mono hidden"></div>
          <div id="sCustom" class="mono hidden"></div>
          <div id="sRankBlock">
            <img id="sRankIcon" alt="" onerror="this.style.display='none'">
            <div id="sRankText">
              <div class="eyebrow mono">System Rank</div>
              <div id="sRankLetter" class="mono">—</div>
            </div>
          </div>
        </div>
        <div id="sIcons"></div>
      </div>
      <div class="rule"></div>
      <div id="sTiles">
        <div class="tile">
          <div class="tLabel mono">Milestones</div>
          <div class="tVal mono"><b id="sMile">—</b><span id="sMileTot"></span></div>
          <div class="bar"><i id="sBar"></i></div>
        </div>
        <div class="tile">
          <div class="tLabel mono">System Points</div>
          <div class="tVal mono"><b id="sPts">—</b></div>
        </div>
      </div>
      <div id="sQuestSect" class="hidden">
        <div class="sect eyebrow mono">Objective</div>
        <div id="sQuest">
          <div id="sQuestRow">
            <div id="sQuestText" class="mono"></div>
            <div id="sQuestCount" class="mono"></div>
          </div>
          <div class="bar"><i id="sQuestBar"></i></div>
        </div>
      </div>
      <div id="sAttSect">
        <div class="sect eyebrow mono">Attunements</div>
        <div id="sAtt"></div>
      </div>
      <div id="sTitleSect">
        <div class="sect eyebrow mono">Titles</div>
        <div id="sTitles"></div>
      </div>
      <div id="sFoot"><div id="sActions"></div></div>
    </div>
  </div>

  <!-- SYSTEM SHOP -->
  <div id="screen-shop" class="screen">
    <div class="backdrop"></div>
    <div id="shopCard" class="glass">
      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="shHead">
        <div>
          <div class="eyebrow mono">System · Shop</div>
          <div id="shTitle" class="mono">Exchange</div>
        </div>
        <div class="chip mono"><i></i>System Points <b id="shPoints">—</b></div>
      </div>
      <div class="rule"></div>
      <div id="shBody">
        <div id="shRail"></div>
        <div id="shGrid"></div>
      </div>
      <div id="shFoot">
        <div id="shHint" class="mono">Delivered into your Dimensional Storage · ESC to close</div>
        <button id="shClose" class="btn mono" onclick="shopClose()">Close</button>
      </div>
    </div>
  </div>

  <!-- LEVEL-UP FLOURISH -->
  <div id="screen-flourish" class="screen">
    <div id="fFlash"></div>
    <div id="fPillar"></div>
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="ring r3"></div><div class="ring dia"></div>
    <div id="fSparks"></div>
    <div id="flourish">
      <div id="fTitleWrap">
        <div id="fTitle" class="fT mono"></div>
      </div>
      <div id="fSub" class="mono"></div>
      <div id="fBar"></div>
    </div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const DESIGN_W = 1120, DESIGN_H = 760;   // the scaled stage
const NODE_R = 31;                       // half a base-size node box, in canvas px
const RAIL = 208;                        // mastery-rail width + gap, reserved on the left

/* Mastery nodes live in the left rail, not the branch graph, so they're excluded from
   the graph layout. The plugin declares the grouping (SkillTree::Zone) rather than us
   re-deriving it from "repeatable and no prereqs". */
const isUtil = (n) => n.zone === "MASTERY";

/* Mastery tier (1-5, Novice..Grandmaster) as a roman numeral for the rank badge. */
const ROMAN = ["", "I", "II", "III", "IV", "V"];

/* Zone -> css modifier, for the tinted frame behind each branch. */
const ZONE_CLASS = { CORE: "z-core", MIGHT: "z-might", ARCANA: "z-arcana", SHADOW: "z-shadow" };
const ZONE_ORDER = ["CORE", "MIGHT", "SHADOW", "ARCANA"];

function showScreen(name) {
  ["tree", "panel", "flourish", "status", "shop"].forEach(s => $("screen-" + s).classList.toggle("active", s === name));
  padReset();
}

/* ---------------- GAMEPAD ----------------
   PrismaUI gives its view the keyboard and the mouse but not a controller, so the plugin
   forwards the pad's buttons here (Prisma::SendGamepad, called from src/UI/Input.cpp).

   Focus navigation, not a synthetic cursor: this is a DOM, every target is already an
   element, and moving focus is what a page does natively. The built-in ImGui renderer
   had to do the opposite for the opposite reason — its skill tree is a canvas with no
   elements in it to focus. Same feature, two mechanisms, each the cheap one for its
   renderer. */
let padIndex = -1;

function padTargets() {
  const screen = document.querySelector(".screen.active");
  if (!screen) return [];
  return [...screen.querySelectorAll(".btn, .iconBtn, .node, .card, .shelf, .mrow")]
    .filter(el => el.offsetParent !== null);
}

function padReset() {
  padIndex = -1;
  document.querySelectorAll(".padfocus").forEach(el => el.classList.remove("padfocus"));
}

function padMove(step) {
  const t = padTargets();
  if (!t.length) return;
  padIndex = (padIndex + step + t.length) % t.length;
  t.forEach((el, i) => el.classList.toggle("padfocus", i === padIndex));
  t[padIndex].scrollIntoView({ block: "nearest" });
  /* Tooltips hang off mouseenter, which a pad never sends. */
  t[padIndex].dispatchEvent(new MouseEvent("mouseenter", { bubbles: false }));
}

window.isekaiPad = (btn) => {
  switch (btn) {
    case "up": case "left": padMove(-1); break;
    case "down": case "right": padMove(1); break;
    case "a": {
      const t = padTargets();
      if (padIndex < 0) { padMove(1); break; }   // first press only takes focus
      if (t[padIndex]) t[padIndex].click();
      break;
    }
    case "b":
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
      break;
  }
};

/* Scale the fixed tree canvas to the viewport — shrink freely, but never blow it up
   past a comfortable size (the old min(vw/W, vh/H) reached ~1.9x on a 1440p screen
   and the panel filled the entire display). */
function fitTree() {
  const s = Math.min(window.innerWidth * 0.92 / DESIGN_W,
                     window.innerHeight * 0.82 / DESIGN_H, 1.55);
  document.documentElement.style.setProperty("--scale", s.toFixed(4));
}

/* ---------------- SKILL TREE ---------------- */
let TREE = { points: 0, perks: 0, perkMax: 255, nodes: [] };
const byKey = new Map();

/* Fit the graph to whatever the canvas measures: derive the extents from the data
   rather than hardcoding them, scale uniformly (never stretch) and centre. That keeps
   the layout balanced and stops the leftmost column hugging the frame. */
function layout() {
  const canvas = $("canvas");
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const graph = TREE.nodes.filter(n => !isUtil(n));
  if (!graph.length || !W || !H) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  graph.forEach(n => {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
  });
  const cw = Math.max(1, maxX - minX), ch = Math.max(1, maxY - minY);
  /* Asymmetric padding: a zone's header sits above its topmost node and every node
     carries a name below it, so the graph needs more room top and bottom than sideways.
     Symmetric padding clipped both. */
  const padX = NODE_R + 30;
  const padTop = NODE_R + 42;
  const padBot = NODE_R + 58;   // zone frame's own bottom padding + a two-line name
  const availW = W - RAIL;                       // graph lives right of the mastery rail
  const k = Math.min((availW - padX * 2) / cw, (H - padTop - padBot) / ch);
  return { k, W, H,
           ox: RAIL + (availW - cw * k) / 2 - minX * k,
           oy: padTop + (H - padTop - padBot - ch * k) / 2 - minY * k };
}
const posOf = (L, n) => ({ x: L.ox + n.x * L.k, y: L.oy + n.y * L.k });

/* Half-width of a node tile in canvas px, honouring its per-node scale. Lines trim to
   this, so a bigger landmark node doesn't get its connections drawn under it. */
const radOf = (L, n) => NODE_R * (n.scale || 1) * L.k;

/* The always-on name under a node, in canvas px. These are CSS pixels and deliberately
   do NOT scale with L.k — the text does not either, so a scaled box would stop matching
   what is drawn. Must agree with .nlabel's width / line-height above.

   A node's real footprint is the tile UNION this box, and the box is the wider of the
   two. Everything that used to reason about tiles only — the zone frames, the link
   trimming — got that wrong, which is why labels hung out of their frame and every link
   ran through its own parent's name. */
const LABEL_W = 88, LABEL_GAP = 6, LABEL_LINE = 12.5, LABEL_LINES = 2;
const LABEL_H = LABEL_GAP + LABEL_LINE * LABEL_LINES;

/* The box a node occupies including its name, in canvas px. LABEL_LINES is assumed
   rather than measured: reserving room for two lines everywhere keeps the frames from
   jittering as names wrap differently, and the branch frames share a bottom regardless. */
function nodeBox(L, n) {
  const p = posOf(L, n), r = radOf(L, n), hw = Math.max(r, LABEL_W / 2);
  return { x0: p.x - hw, x1: p.x + hw, y0: p.y - r, y1: p.y + r + LABEL_H };
}

/* One padded box per zone, derived from that zone's own node positions rather than
   hardcoded — a node moving inside its band keeps the frame correct automatically.

   The padding is in DESIGN units and scaled by L.k, exactly like the positions and the
   node radii. Unscaled padding was the bug behind the overlapping frames: the gaps
   between bands shrink with k while a fixed pad does not, so below k ~0.9 the frames
   grew into each other. Scaled, the clearances declared in SkillTree.cpp's layout note
   hold at every window size.

   The box is grown from nodeBox, not from the tiles: a name is wider than its tile, so
   framing the tiles left every outer name hanging over the border. ZPAD_BOT is small
   now because the name is inside the box rather than something the padding has to
   guess room for. */
const ZPAD_X = 10, ZPAD_TOP = 18, ZPAD_BOT = 12;  // design units

function zoneBoxes(L) {
  const px = ZPAD_X * L.k, pt = ZPAD_TOP * L.k, pb = ZPAD_BOT * L.k;
  const raw = [];
  ZONE_ORDER.forEach(z => {
    const members = TREE.nodes.filter(n => n.zone === z && !isUtil(n));
    if (!members.length) return;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    members.forEach(n => {
      const b = nodeBox(L, n);
      x0 = Math.min(x0, b.x0); x1 = Math.max(x1, b.x1);
      y0 = Math.min(y0, b.y0); y1 = Math.max(y1, b.y1);
    });
    raw.push({ zone: z, cls: ZONE_CLASS[z] || "", x0, x1, y0, y1, branch: z !== "CORE" });
  });

  /* The three branches are siblings, so they get a shared top and bottom. Hugging their
     own content made them ragged — MIGHT holds one row fewer than SHADOW, so its frame
     ended ~130px higher and read as a glitch rather than as a group. */
  const branches = raw.filter(b => b.branch);
  if (branches.length > 1) {
    const top = Math.min(...branches.map(b => b.y0));
    const bot = Math.max(...branches.map(b => b.y1));
    branches.forEach(b => { b.y0 = top; b.y1 = bot; });
  }

  return raw.map(b => ({ zone: b.zone, cls: b.cls,
                         x: b.x0 - px, y: b.y0 - pt,
                         w: (b.x1 - b.x0) + px * 2, h: (b.y1 - b.y0) + pt + pb }));
}

/* Pull point a toward b so lines stop at the tile edge instead of running underneath. */
function trimTo(a, b, r) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: a.x + dx / len * r, y: a.y + dy / len * r };
}

/* Where the link from `from` to `to` should start: the point at which it leaves the
   PARENT's box — tile plus name. Trimming to the tile radius alone put the first ~25px
   of every link straight through the parent's own name, because the name is wider than
   the tile and sits exactly where the children's links fan out.

   Children need no equivalent: their name is below them and links arrive from above. */
function linkStart(L, from, to, gap) {
  const a = posOf(L, from), b = posOf(L, to);
  const dx = b.x - a.x, dy = b.y - a.y;
  const box = nodeBox(L, from);
  // Distance along the ray at which it leaves each wall of the box; the nearest wins.
  const hits = [];
  if (dx > 0) hits.push((box.x1 - a.x) / dx);
  if (dx < 0) hits.push((box.x0 - a.x) / dx);
  if (dy > 0) hits.push((box.y1 - a.y) / dy);
  if (dy < 0) hits.push((box.y0 - a.y) / dy);
  const t = hits.length ? Math.min(...hits) : 0;
  const len = Math.hypot(dx, dy) || 1;
  const d = Math.min(t * len + gap, len - radOf(L, to) - gap);
  return { x: a.x + dx / len * d, y: a.y + dy / len * d };
}

function stateOf(n) {
  if (n.owned) return "owned";
  const reachable = n.prereqMet && n.tierMet;
  if (reachable && TREE.points >= n.cost) return "buyable";
  if (reachable) return "poor";
  if (!n.tierMet) return "sealed";
  return "locked";
}
function statusOf(n) {
  // Mastery nodes (capped repeatables) show their named tier alongside the raw rank;
  // Perk Synthesis and one-shot nodes keep the plain "Rank N" form.
  const tag = n.masteryTier > 0 ? " · " + n.masteryTierName + " (" + n.rank + "/" + n.maxRank + ")"
            : n.repeatable ? " · Rank " + n.rank + (n.maxRank > 0 ? "/" + n.maxRank : "") : "";
  if (n.repeatable && n.maxRank > 0 && n.rank >= n.maxRank) {
    return { t: (n.masteryTier > 0 ? "Grandmaster" : "Maxed") + tag, c: "var(--accent)" };
  }
  if (n.owned) return { t: "Unlocked", c: "var(--accent)" };
  if (!n.tierMet) return {
    // A dormant blessing seals by level, not by the rebirth you chose.
    t: n.reqLevel ? "Sealed — awakens at level " + n.reqLevel
                  : "Sealed — needs " + n.reqPower + " rebirth",
    c: "var(--amber)"
  };
  if (!n.prereqMet) return { t: "Locked — needs a connected node", c: "var(--dim)" };
  const ok = TREE.points >= n.cost;
  return { t: n.cost + " system point(s)" + tag, c: ok ? "var(--accent)" : "var(--danger)" };
}

let hoverKey = 0;

function showTip(n, el) {
  if (!n || !el) return;
  hoverKey = n.key;
  const tip = $("tip");
  $("tipName").textContent = n.name;
  $("tipDesc").textContent = n.desc;
  const s = statusOf(n);
  $("tipStatus").textContent = s.t;
  $("tipStatus").style.color = s.c;
  // Position from the element's actual box (works for graph nodes AND rail nodes,
  // whose positions come from flex layout, not inline left/top). Flip before it runs
  // off the right edge.
  const canvas = $("canvas"), cr = canvas.getBoundingClientRect(), er = el.getBoundingClientRect();
  const cx = er.left - cr.left + er.width / 2, cy = er.top - cr.top + er.height / 2;
  const flip = cx > canvas.clientWidth - 330;
  tip.style.left = (flip ? cx - 316 - 26 : cx + 42) + "px";
  tip.style.top = Math.max(4, cy - 40) + "px";
  tip.classList.add("show");
}
function hideTip() { hoverKey = 0; $("tip").classList.remove("show"); }

const STATES = ["owned", "buyable", "poor", "sealed", "locked"];
const nodeEls = new Map();   // node key -> graph tile, kept across refreshes
const rowEls  = new Map();   // node key -> mastery row, kept across refreshes
let builtFor = "";           // which node set is currently in the DOM

/* The bare tile (icon + hover/click wiring) both the graph and the mastery rail use. */
function makeNodeEl(n, delayMs) {
  const el = document.createElement("div");
  el.className = "node";
  el.style.animationDelay = delayMs + "ms";
  const img = document.createElement("img");
  img.src = "icons/" + n.icon;
  img.onerror = () => { img.style.display = "none"; };
  el.appendChild(img);
  return el;
}

/* Buy-on-click, shared by the graph tile and the mastery row. */
function tryBuy(key) {
  const cur = byKey.get(key);
  if (cur && stateOf(cur) === "buyable") callBack("isekaiBuy", String(key));
}

/* The mastery rail: one row per stat — icon, name, ten rank pips grouped into the five
   tiers, and the tier's name. A column of bare icons gave no clue what any of them did
   or how far along it was, which is what made the rail read as a toolbar. */
function renderMasteryRail() {
  const host = $("urailNodes");
  TREE.nodes.filter(isUtil).forEach((n, i) => {
    let row = rowEls.get(n.key);
    if (!row) {
      row = document.createElement("div");
      row.className = "mrow";
      const tile = makeNodeEl(n, i * 20);
      tile.classList.add("docked");
      const body = document.createElement("div");
      body.className = "mBody";
      const nm = document.createElement("div");
      nm.className = "mName mono";
      nm.textContent = n.name;
      const meta = document.createElement("div");
      meta.className = "mMeta";
      const pips = document.createElement("div");
      pips.className = "mPips";
      const max = n.maxRank || 10;
      for (let r = 0; r < max; r++) {
        const pip = document.createElement("i");
        // A gap after every second pip makes the five tiers legible at a glance.
        if (r % 2 === 1 && r !== max - 1) pip.classList.add("sep");
        pips.appendChild(pip);
      }
      const tier = document.createElement("div");
      tier.className = "mTier mono";
      meta.appendChild(pips); meta.appendChild(tier);
      body.appendChild(nm); body.appendChild(meta);
      row.appendChild(tile); row.appendChild(body);
      row.addEventListener("mouseenter", () => showTip(byKey.get(n.key), row));
      row.addEventListener("mouseleave", hideTip);
      row.addEventListener("click", () => tryBuy(n.key));
      host.appendChild(row);
      rowEls.set(n.key, row);
    }

    const st = stateOf(n);
    const tile = row.querySelector(".node");
    STATES.forEach(s => { row.classList.remove(s); tile.classList.remove(s); });
    row.classList.add(st);
    tile.classList.add(st);

    const pipEls = row.querySelectorAll(".mPips i");
    for (let r = 0; r < pipEls.length; r++) pipEls[r].classList.toggle("on", r < n.rank);

    const tierEl = row.querySelector(".mTier");
    tierEl.textContent = n.rank > 0 ? (n.masteryTierName || "").toUpperCase()
                                    : n.cost + " SP";
    tierEl.className = "mTier mono" + (n.masteryTier >= 5 ? " t5" : "");
  });
}

/* Refreshes never tear the graph down — buying a node used to rebuild every element,
   which replayed the staggered entrance animation and made the whole tree blink. */
function renderTree() {
  $("hPoints").textContent = TREE.points;
  $("hPerks").textContent = TREE.perks + " / " + TREE.perkMax;
  renderRespec();

  const L = layout();
  if (!L) return;

  byKey.clear();
  TREE.nodes.forEach(n => byKey.set(n.key, n));

  const canvas = $("canvas");
  const sig = TREE.nodes.map(n => n.key).join(",");
  if (sig !== builtFor) {                    // different tree -> start clean
    [...canvas.querySelectorAll(".node")].forEach(e => e.remove());
    [...$("urailNodes").querySelectorAll(".mrow")].forEach(e => e.remove());
    nodeEls.clear();
    rowEls.clear();
  }

  // --- zone frames (behind everything; cheap, so rebuilt each pass) ---
  const zl = $("zones");
  zl.innerHTML = "";
  zoneBoxes(L).forEach(b => {
    const el = document.createElement("div");
    el.className = "zone " + b.cls;
    el.style.left = b.x + "px"; el.style.top = b.y + "px";
    el.style.width = b.w + "px"; el.style.height = b.h + "px";
    const nm = document.createElement("div");
    nm.className = "zoneName mono";
    nm.textContent = b.zone;
    el.appendChild(nm);
    zl.appendChild(el);
  });

  // --- connections (cheap to rebuild; there are only a handful) ---
  const svg = $("lines");
  svg.setAttribute("viewBox", "0 0 " + L.W + " " + L.H);
  svg.innerHTML = "";
  /* A link is a straight line unless a third node stands in the way, in which case it
     bows around it. Only one link needs this today — the hub reaches Swift Blood
     straight through System Analysis, which made the tree claim a gate that does not
     exist — but doing it by geometry rather than by special case means the next node
     added below the hub cannot reintroduce the lie. */
  const addLink = (a, b, bow, cls) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg",
                                        bow ? "path" : "line");
    if (bow) {
      el.setAttribute("d", `M ${a.x} ${a.y} Q ${bow.x} ${bow.y} ${b.x} ${b.y}`);
    } else {
      el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
      el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
    }
    el.setAttribute("class", "lnk " + cls);
    svg.appendChild(el);
  };

  /* The control point that clears whatever the straight segment runs into, or null. */
  function bowAround(L, a, b, from, to) {
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    let worst = 0, side = 1;
    TREE.nodes.filter(n => !isUtil(n) && n !== from && n !== to).forEach(n => {
      const p = posOf(L, n), r = radOf(L, n);
      // Distance from the node centre to the segment, and which side it falls on.
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (len * len)));
      const d = Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
      const need = r + 10 - d;
      if (need > worst) {
        worst = need;
        // Bow away from the obstacle; a dead-centre one goes right by convention.
        side = (dx * (p.y - a.y) - dy * (p.x - a.x)) > 0 ? -1 : 1;
      }
    });
    if (worst <= 0) return null;
    const off = (worst + 14) * 2;  // quadratic peaks at half the control offset
    return { x: (a.x + b.x) / 2 + (-dy / len) * off * side,
             y: (a.y + b.y) / 2 + (dx / len) * off * side };
  }

  TREE.nodes.forEach(n => (n.prereq || []).forEach(pk => {
    if (!pk) return;
    const from = byKey.get(pk); if (!from) return;
    const q = posOf(L, n);
    const a = linkStart(L, from, n, 5), b = trimTo(q, posOf(L, from), radOf(L, n) + 5);
    const bow = bowAround(L, a, b, from, n);
    if (from.owned && n.owned) { addLink(a, b, bow, "halo"); addLink(a, b, bow, "on"); }
    else                        { addLink(a, b, bow, from.owned ? "half" : "off"); }
  }));

  // --- graph nodes: create once, then update in place ---
  TREE.nodes.filter(n => !isUtil(n)).forEach((n, i) => {
    let el = nodeEls.get(n.key);
    if (!el) {
      el = makeNodeEl(n, i * 20);
      const lab = document.createElement("div");
      lab.className = "nlabel mono";
      lab.textContent = n.name;
      el.appendChild(lab);
      el.addEventListener("mouseenter", () => showTip(byKey.get(n.key), el));
      el.addEventListener("mouseleave", hideTip);
      el.addEventListener("click", () => tryBuy(n.key));
      canvas.appendChild(el);
      nodeEls.set(n.key, el);
    }

    // Swap only the state class, so .node's entrance animation is never restarted.
    STATES.forEach(s => el.classList.remove(s));
    el.classList.add(stateOf(n));

    const p = posOf(L, n);
    el.style.setProperty("--ns", (NODE_R * 2 * (n.scale || 1) * L.k) + "px");
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";

    let pip = el.querySelector(".rank");
    if (n.repeatable && n.rank > 0) {
      if (!pip) { pip = document.createElement("div"); pip.className = "rank"; el.appendChild(pip); }
      // Mastery nodes show the tier as a roman numeral (I-V); Perk Synthesis (not a
      // mastery node — no tier) keeps the raw purchase count.
      pip.textContent = n.masteryTier > 0 ? ROMAN[n.masteryTier] : n.rank;
      pip.className = "rank" + (n.masteryTier > 0 ? " tier" + n.masteryTier : "");
    } else if (pip) {
      pip.remove();
    }
  });

  renderMasteryRail();
  builtFor = sig;

  // Keep the tooltip alive across a refresh: after buying, the cursor is still on the
  // node, so re-render its card with the new state instead of letting it vanish. The
  // anchor is the graph tile or the mastery row, whichever holds this key.
  const anchor = nodeEls.get(hoverKey) || rowEls.get(hoverKey);
  if (hoverKey && anchor && byKey.has(hoverKey)) {
    showTip(byKey.get(hoverKey), anchor);
  }
}

window.isekaiShowTree = (data) => {
  try { TREE = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  const wasOpen = $("screen-tree").classList.contains("active");
  showScreen("tree");
  if (!wasOpen) hideTip();             // a refresh keeps whatever the cursor is on
  fitTree();
  requestAnimationFrame(renderTree);   // let the stage lay out before measuring the canvas
};
function closeTree() { callBack("isekaiCloseTree", ""); }

/* Respec: two-click confirm instead of a nested dialog. The first press arms the
   button, a second within 3s commits; anything else disarms it. */
let respecArmed = 0;
function renderRespec() {
  const btn = $("tRespec");
  const amount = TREE.respec || 0;
  btn.classList.toggle("hidden", amount <= 0);
  if (amount <= 0) { respecArmed = 0; btn.classList.remove("armed"); return; }
  btn.classList.toggle("armed", !!respecArmed);
  btn.textContent = respecArmed ? "Confirm?" : "Respec  +" + amount;
  btn.title = "Refunds the System Points spent on stat nodes.\n"
            + "Knowledge unlocks and Perk Synthesis stay — the System cannot "
            + "un-teach what you already know.";
}
function respecClick() {
  if (respecArmed) {
    clearTimeout(respecArmed);
    respecArmed = 0;
    callBack("isekaiRespec", "");
  } else {
    respecArmed = setTimeout(() => { respecArmed = 0; renderRespec(); }, 3000);
  }
  renderRespec();
}

/* ---------------- DIALOG PANEL ---------------- */
let PANEL = { title: "", body: "", reveal: 45, width: 720, buttons: [] };
let panelRAF = 0, panelStart = 0, buttonsShown = false;

function textButtons() { return PANEL.buttons.filter(b => !b.iconOnly); }

function buildButtons() {
  const row = $("pButtons"); row.innerHTML = "";
  const icons = $("pIcons"); icons.innerHTML = "";
  PANEL.buttons.forEach((b, i) => {
    const el = document.createElement("button");
    if (b.iconOnly) {
      el.className = "iconBtn";
      el.innerHTML = '<span class="lbl">' + esc(b.label) + "</span>" +
                     (b.icon ? '<img src="icons/' + b.icon + '">' : "");
      icons.appendChild(el);
    } else {
      el.className = "btn mono";
      el.innerHTML = (b.icon ? '<img src="icons/' + b.icon + '">' : "") +
                     '<span class="lbl">' + esc(b.label) + "</span>";
      row.appendChild(el);
    }
    el.onclick = () => choose(i);
  });
  row.style.visibility = "hidden";
}
/* Colour the panel body from its own shape rather than from markup, the same rule the
   built-in renderer uses (DrawBody in src/UI/SystemWindow.cpp):

     - a short ALL-CAPS run followed by a column gap is a label, and takes the accent
     - the value after it stays bright, because that is what you opened the panel to read
     - an all-caps line standing on its own is a heading

   Keeping it a rule instead of markup means the plugin's strings stay plain text — the
   same string feeds this view and the ImGui panel, so anything else would have to be
   understood, or stripped, by both. */
function colouriseBody(text) {
  return text.split("\n").map(line => {
    const first = line.search(/\S/);
    if (first < 0) return esc(line);

    const gap = line.indexOf("  ", first);
    const value = gap < 0 ? -1 : line.slice(gap).search(/\S/);
    // A label is short; prose that happens to contain a double space is not a table row,
    // and colouring half a sentence would look like a fault.
    if (gap >= 0 && value >= 0 && (gap - first) <= 22) {
      const at = gap + value;
      return '<span class="lbl">' + esc(line.slice(0, at)) + "</span>" + esc(line.slice(at));
    }
    const caps = /[A-Za-z]/.test(line) && line === line.toUpperCase();
    return caps ? '<span class="head">' + esc(line) + "</span>" : esc(line);
  }).join("\n");
}

function tickPanel(now) {
  if (!panelStart) panelStart = now;
  const shown = Math.floor((now - panelStart) / 1000 * PANEL.reveal);
  const done = shown >= PANEL.body.length;
  $("pBody").innerHTML =
    colouriseBody(done ? PANEL.body : PANEL.body.slice(0, shown)) + (done ? "" : "▌");
  if (done && !buttonsShown) { buttonsShown = true; $("pButtons").style.visibility = "visible"; }
  if (!done) panelRAF = requestAnimationFrame(tickPanel);
}
/* Click anywhere on the panel while it is still typing to skip to the full text. The
   buttons stay hidden until the reveal is done, so this click cannot also press one.
   (The built-in renderer does the same — see DrawPanel in src/UI/SystemWindow.cpp.) */
$("screen-panel").addEventListener("click", () => {
  if (buttonsShown || !PANEL.body) return;
  panelStart = performance.now() - (PANEL.body.length + 1) / PANEL.reveal * 1000;
  tickPanel(performance.now());
});

window.isekaiShowPanel = (data) => {
  try { PANEL = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("panel");
  $("pTitle").textContent = PANEL.title;
  document.documentElement.style.setProperty("--pw", (PANEL.width || 720) + "px");
  buildButtons();
  cancelAnimationFrame(panelRAF); panelStart = 0; buttonsShown = false;
  $("pBody").textContent = "";
  panelRAF = requestAnimationFrame(tickPanel);
};
function choose(i) { callBack("isekaiChoose", String(i)); }

/* ---------------- STATUS LEDGER ---------------- */
let STATUS = {};
let rebootArmed = 0;

function statusAction(a) { callBack("isekaiStatusAction", a); }

/* Reboot needs a deliberate second press, same idea as respec — it re-opens the whole
   blessing choice, so a stray click shouldn't fire it. */
function rebootClick(btn) {
  if (rebootArmed) {
    clearTimeout(rebootArmed); rebootArmed = 0;
    statusAction("reboot");
    return;
  }
  btn.classList.add("armed");
  btn.textContent = "Confirm reboot?";
  rebootArmed = setTimeout(() => {
    rebootArmed = 0; btn.classList.remove("armed"); btn.textContent = "Reboot";
  }, 3000);
}

function buildStatusActions() {
  const s = STATUS;
  const icons = $("sIcons"); icons.innerHTML = "";
  const box = $("sActions"); box.innerHTML = ""; rebootArmed = 0;

  // Skill Tree / Storage / Shop as the top-right icon buttons; Reboot / Close as footer text.
  const addIcon = (label, img, onClick) => {
    const b = document.createElement("button");
    b.className = "iconBtn";
    b.innerHTML = '<span class="lbl">' + esc(label) + "</span>"
                + '<img src="icons/' + img + '" onerror="this.style.display=\'none\'">';
    b.onclick = onClick; icons.appendChild(b);
  };
  const addBtn = (label, cls, onClick) => {
    const b = document.createElement("button");
    b.className = "btn mono" + (cls ? " " + cls : "");
    b.textContent = label; b.onclick = onClick; box.appendChild(b); return b;
  };

  if (s.hasTree)    addIcon("Skill Tree", "ui_skilltree.png", () => statusAction("tree"));
  if (s.hasStorage) addIcon("Storage", "ui_storage.png", () => statusAction("storage"));
  if (s.hasShop)    addIcon("Shop", "ui_shop.png", () => statusAction("shop"));
  // New Task throws the objective away and rolls another, free and instantly. That is a
  // testing tool rather than a feature — it walks straight around the schedule the
  // objectives are supposed to arrive on — so the plugin decides whether it exists at
  // all (QuestRerollButton in the ini, off by default) and the view only obeys.
  if (s.questCanReroll)  addBtn("New Task", "", () => statusAction("reroll"));
  if (s.canReboot)  { const rb = addBtn("Reboot", "amber", () => rebootClick(rb)); }
  addBtn("Close", "", () => statusAction("close"));
}

function renderStatus() {
  const s = STATUS;
  $("sTier").textContent = s.tier || "NORMAL";
  // Insignia + letter. The plugin sends the letter only, so the file name is derived
  // here the same way Progression::RankIcon derives it on the C++ side.
  const rank = (s.rank || "E").toUpperCase();
  const icon = $("sRankIcon");
  icon.style.display = "";           // a previous rank's missing PNG may have hidden it
  icon.src = "icons/rank_" + rank.toLowerCase() + ".png";
  const letter = $("sRankLetter");
  letter.textContent = "RANK " + rank;
  // "rank-c" and friends carry the ramp; anything unexpected falls back to E's steel.
  letter.className = "mono rank-" + ("SABCDE".includes(rank) ? rank.toLowerCase() : "e");

  const mode = s.mode || "";
  const mb = $("sMode");
  mb.textContent = mode;
  mb.classList.toggle("hidden", !mode);
  mb.classList.toggle("dormant", mode === "DORMANT");

  const aw = $("sAwaken");
  if (s.nextAwakening > 0) { aw.textContent = "Awakens at level " + s.nextAwakening; aw.classList.remove("hidden"); }
  else aw.classList.add("hidden");

  // A CUSTOM build's three dials rarely agree, so spell them out under the header.
  const cu = $("sCustom");
  if (mode === "CUSTOM") {
    cu.innerHTML = "Rewards <b>" + esc(s.rewardTier || s.tier) + "</b> · "
                 + "Tree <b>" + esc(s.treeTier || s.tier) + "</b> · "
                 + "Gift <b>" + esc(s.grantTier || "NORMAL") + "</b>";
    cu.classList.remove("hidden");
  } else {
    cu.classList.add("hidden");
  }

  const earned = s.milestonesEarned || 0, total = s.milestonesTotal || 0;
  $("sMile").textContent = earned;
  $("sMileTot").textContent = " / " + total;
  $("sBar").style.width = (total ? Math.round(100 * earned / total) : 0) + "%";
  $("sPts").textContent = s.points || 0;

  // The standing objective. Objectives are no longer permanent: between them the System
  // stands down for a while, so an empty questText with hours on the clock means "waiting"
  // and has to say so — otherwise an idle System is indistinguishable from a broken one.
  // Both empty means no work at all (an un-reincarnated character); section stays hidden.
  const qText = s.questText || "";
  const qWait = s.questWaitHours || 0;
  $("sQuestSect").classList.toggle("hidden", !qText && !qWait);
  if (qText) {
    const qp = s.questProgress || 0, qt = s.questTarget || 0;
    $("sQuestText").textContent = qText;
    $("sQuestCount").innerHTML = qp + " / " + qt +
                                 '<span>+' + (s.questReward || 0) + " SP</span>";
    $("sQuestBar").style.width = (qt ? Math.round(100 * Math.min(qp, qt) / qt) : 0) + "%";
  } else if (qWait) {
    $("sQuestText").textContent = "The System is quiet.";
    $("sQuestCount").innerHTML = "<span>next in ~" + qWait + "h</span>";
    $("sQuestBar").style.width = "0%";
  }

  const at = $("sAtt"); at.innerHTML = "";
  (s.attunements || []).forEach(a => {
    const d = document.createElement("div"); d.className = "att mono";
    d.innerHTML = '<span class="aName">' + esc(a.stat) + '</span><b>+' + a.amount + "</b>";
    at.appendChild(d);
  });
  $("sAttSect").classList.toggle("hidden", !(s.attunements || []).length);

  const tl = $("sTitles"); tl.innerHTML = "";
  const titles = s.titles || [];
  if (titles.length) {
    titles.forEach(t => {
      const d = document.createElement("div"); d.className = "trow mono";
      d.innerHTML = '<span class="tName">' + esc(t.name) + "</span>"
                  + '<span class="tEff">' + esc(t.effect) + "</span>"
                  + '<span class="tQuest">' + esc(t.quest) + "</span>";
      tl.appendChild(d);
    });
