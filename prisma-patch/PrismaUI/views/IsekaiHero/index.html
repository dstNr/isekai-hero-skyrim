<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isekai Hero — System UI</title>
<style>
  :root {
    /* Palette — deep void navy + system cyan, with a warm "sealed" accent. */
    --void:      #04070e;
    --surface:   rgba(9, 18, 33, 0.86);
    --surface-2: rgba(14, 26, 44, 0.72);
    --accent:    #5ad2ff;
    --accent-dk: #1b7fb0;
    --text:      #e2f2ff;
    --dim:       #8aa8c4;
    --amber:     #e0a860;
    --danger:    #ff6b6b;
    --line:      rgba(90, 210, 255, 0.28);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none;
      -webkit-font-smoothing: antialiased; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
               font-family: "Segoe UI", Inter, system-ui, sans-serif; color: var(--text); }
  .mono { font-family: Consolas, "SF Mono", "Roboto Mono", monospace; }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  /* Backdrop: vignette + faint scanlines, so the game reads as "behind glass". */
  /* Lighter centre so the scene shows through the (now translucent) panel; the vignette
     still darkens the edges to keep focus on the window. */
  .backdrop { position: fixed; inset: 0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(26,110,160,0.16), transparent 70%),
      radial-gradient(ellipse at center, rgba(2,5,10,0.30), rgba(2,5,10,0.74));
    animation: veilIn 0.35s var(--ease) both; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Shared glass surface ---------- */
  /* NOTE: deliberately no backdrop-filter. A full-screen blur is re-computed every
     frame in Ultralight and was the main source of the stutter in the System menu.
     Instead the surface is simply translucent (~0.82) — the scene shows through a
     little, which reads as "glass" and costs nothing. */
  .glass {
    position: relative;
    background:
      linear-gradient(180deg, rgba(90,210,255,0.08), transparent 22%),
      linear-gradient(160deg, rgba(9,18,33,0.84), rgba(12,24,41,0.78));
    box-shadow:
      0 0 0 1px rgba(90,210,255,0.22),
      0 0 34px rgba(26,110,160,0.28),
      0 24px 70px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    animation: riseIn 0.42s var(--ease) both;
  }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px) scale(0.985); }
                      to   { opacity: 1; transform: none; } }
  /* Hairline gradient frame that brightens toward the corners. */
  .glass::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(90,210,255,0.5), transparent 28%, transparent 72%, rgba(90,210,255,0.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; padding: 1px; }

  .bracket { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--accent);
             opacity: 0.9; filter: drop-shadow(0 0 6px rgba(90,210,255,0.7)); pointer-events: none; }
  .bracket.tl { top: 9px; left: 9px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 9px; right: 9px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; }

  .eyebrow { color: var(--accent); letter-spacing: 0.34em; text-transform: uppercase;
             text-shadow: 0 0 18px rgba(90,210,255,0.55); }

  /* Static section rule. A shine used to sweep across this forever (animation: sweep
     … infinite). Ultralight (PrismaUI's renderer) has no idle short-cut for such
     animations the way a real browser's compositor does: any never-ending animation
     keeps the whole view repainting every frame, which is the main cause of the
     in-game FPS drop while the UI is open. The gradient line alone reads just as well
     and lets the page go fully idle when nothing is happening. */
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent); }

  /* Buttons */
  .btn { position: relative; background: linear-gradient(180deg, rgba(90,210,255,0.10), rgba(90,210,255,0.03));
         color: var(--text); border: 1px solid rgba(90,210,255,0.45); letter-spacing: 0.2em;
         cursor: pointer; overflow: hidden; transition: all 0.22s var(--ease);
         text-transform: uppercase; font-weight: 600; }
  .btn:hover { border-color: var(--accent); color: #fff;
               box-shadow: 0 0 22px rgba(90,210,255,0.35), inset 0 0 22px rgba(90,210,255,0.12);
               transform: translateY(-1px); }
  .btn:active { transform: translateY(0); box-shadow: inset 0 0 26px rgba(90,210,255,0.25); }
  .btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -50%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
                transition: left 0.5s var(--ease); }
  .btn:hover::after { left: 130%; }

  /* ======================= SKILL TREE ======================= */
  /* Fixed-coordinate graph (node x/y come from the plugin), so the stage is a design
     canvas scaled to fit — clamped so it never fills the whole screen. */
  #stage { width: 1120px; height: 760px; flex: none;
           transform: scale(var(--scale, 1)); transform-origin: center center;
           padding: clamp(18px, 1.6vw, 26px); display: flex; flex-direction: column; }

  #tHead { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
  #tTitle { font-size: 21px; }
  #tChips { display: flex; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
          background: rgba(90,210,255,0.07); border: 1px solid rgba(90,210,255,0.25);
          font-size: 13px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
  .chip b { color: var(--accent); font-size: 15px; letter-spacing: 0.04em; }
  .chip i { width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent); font-style: normal; }

  #tRule { margin: 12px 0 0; }
  #canvas { position: relative; flex: 1; margin-top: 4px; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  /* Unlocked paths get a wide translucent halo plus a bright core line — reads as a
     glow without a per-line filter (cheap). Solid strokes throughout: a gradient on a
     <line> has a degenerate bounding box and renders black. */
  .lnk { stroke-linecap: round; fill: none; }
  .lnk.halo { stroke: rgba(90,210,255,0.22); stroke-width: 8; }
  .lnk.on   { stroke: #9fe6ff; stroke-width: 2.4; }
  .lnk.half { stroke: rgba(90,210,255,0.5);  stroke-width: 1.7; }
  .lnk.off  { stroke: rgba(125,165,200,0.22); stroke-width: 1.2; }

  /* Utility rail: the repeatable, always-open upgrades (no prerequisites) don't hang
     off the branch graph, so instead of leaving them floating they get their own
     labelled dock on the left, set off by a soft divider and a faint tint. */
  #urail { position: absolute; left: 0; top: 0; bottom: 0; width: 118px;
           display: flex; flex-direction: column; align-items: center; padding-top: 6px;
           background: linear-gradient(90deg, rgba(90,210,255,0.045), transparent);
           border-right: 1px solid rgba(90,210,255,0.14); }
  #urailHead { color: var(--dim); font-size: 10px; letter-spacing: 0.32em;
               text-transform: uppercase; opacity: 0.75; }
  #urailNodes { flex: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: clamp(20px, 3.4vh, 46px); }
  .node.docked { position: relative; margin: 0; }   /* flows in the rail, not absolute */

  .node { position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px;
          border-radius: 10px; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(160deg, rgba(20,36,58,0.95), rgba(9,17,30,0.95));
          border: 1px solid rgba(120,150,180,0.22);
          transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
          animation: nodeIn 0.4s var(--ease) both; }
  @keyframes nodeIn { from { opacity: 0; transform: scale(0.75); } to { opacity: 1; transform: scale(1); } }
  .node img { width: 78%; height: 78%; object-fit: contain;
              filter: grayscale(0.8) brightness(0.42); transition: filter 0.25s var(--ease); }

  .node.owned { border-color: rgba(90,210,255,0.9);
    box-shadow: 0 0 0 1px rgba(90,210,255,0.35), 0 0 26px rgba(90,210,255,0.42), inset 0 0 20px rgba(90,210,255,0.16); }
  .node.owned img { filter: none; }
  .node.owned::after { content: ""; position: absolute; inset: -1px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(90,210,255,0.16), transparent 60%); pointer-events: none; }

  /* Affordable cue — STATIC. This ring used to pulse forever (animation: pulse …
     infinite), and with many buyable nodes on screen that kept Ultralight repainting
     the whole view every frame (transform/opacity is compositor-cheap in a browser,
     but Ultralight re-rasters regardless) — the main FPS drain while the tree is open.
     A steady double ring plus the brighter border and box-shadow still make affordable
     nodes pop, and now the page can idle. The cue lives on ::before so swapping the
     node's state class never restarts the entrance animation (no blink on purchase). */
  .node.buyable { border-color: rgba(90,210,255,0.85); cursor: pointer;
                  box-shadow: 0 0 15px rgba(90,210,255,0.32); }
  .node.buyable img { filter: grayscale(0.05) brightness(1); }
  .node.buyable::before { content: ""; position: absolute; inset: -3px; border-radius: 13px;
    border: 1.5px solid rgba(90,210,255,0.75); pointer-events: none; }

  .node.poor   { border-color: rgba(138,168,196,0.4); }
  .node.poor   img { filter: grayscale(0.5) brightness(0.7); }

  /* Sealed (gated by a deeper rebirth): an amber-lit tile behind a fine diagonal
     hatch, like something locked away — replaces the plain dashed border. Static. */
  .node.sealed { border-color: rgba(224,168,96,0.5);
                 box-shadow: inset 0 0 18px rgba(224,168,96,0.12), 0 0 10px rgba(224,168,96,0.10); }
  .node.sealed img { filter: grayscale(0.9) brightness(0.42) sepia(0.4); opacity: 0.82; }
  .node.sealed::after { content: ""; position: absolute; inset: 0; border-radius: 10px;
    pointer-events: none;
    background: repeating-linear-gradient(135deg, rgba(224,168,96,0.13) 0 1px, transparent 1px 8px); }

  .node.locked { opacity: 0.5; }

  .node:hover { transform: scale(1.16) translateY(-2px); border-color: #fff; z-index: 5;
                box-shadow: 0 0 34px rgba(90,210,255,0.6), 0 10px 26px rgba(0,0,0,0.5); }

  .rank { position: absolute; bottom: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px;
          background: linear-gradient(180deg, #0d2033, #071522); border: 1px solid var(--accent);
          border-radius: 6px; color: var(--accent); font-size: 11px; font-weight: 700;
          line-height: 18px; text-align: center; box-shadow: 0 0 12px rgba(90,210,255,0.45); }

  /* Floating tooltip card next to the hovered node. */
  #tip { position: absolute; width: 300px; padding: 14px 16px; pointer-events: none; opacity: 0;
         transform: translateY(6px); transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
         background: linear-gradient(180deg, rgba(11,22,38,0.97), rgba(7,15,27,0.97));
         border: 1px solid rgba(90,210,255,0.35); border-radius: 10px; z-index: 20;
         box-shadow: 0 18px 44px rgba(0,0,0,0.65), 0 0 24px rgba(26,110,160,0.3); }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tipName { color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  #tipDesc { color: var(--text); font-size: 13px; line-height: 1.5; margin-top: 7px; white-space: pre-line; opacity: 0.9; }
  #tipStatus { font-size: 12px; margin-top: 11px; letter-spacing: 0.12em; font-weight: 600; text-transform: uppercase; }

  #tFoot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #tHint { color: var(--dim); font-size: 12px; letter-spacing: 0.16em; opacity: 0.7; }
  #tActions { display: flex; gap: 12px; }
  #tActions .btn { padding: 12px 30px; font-size: 13px; }
  /* Respec is amber, not cyan — it takes something away rather than granting it. */
  #tRespec { border-color: rgba(224,168,96,0.5); }
  #tRespec:hover { border-color: var(--amber);
                   box-shadow: 0 0 22px rgba(224,168,96,0.32), inset 0 0 22px rgba(224,168,96,0.12); }
  #tRespec.armed { border-color: var(--amber); color: #fff;
                   box-shadow: 0 0 20px rgba(224,168,96,0.55); }
  #tRespec.hidden { display: none; }

  /* ======================= DIALOG PANEL ======================= */
  #panel { width: min(var(--pw, 720px), 92vw); max-height: 88vh;
           padding: clamp(24px, 2.4vw, 40px); display: flex; flex-direction: column; }
  #pTitle { font-size: clamp(17px, 1.45vw, 23px); text-align: center; }
  #pRule { margin: 16px 0 20px; }
  #pBody { color: var(--text); font-size: clamp(14px, 1.02vw, 17px); line-height: 1.65;
           white-space: pre-wrap; overflow-y: auto; flex: 1; opacity: 0.94; }
  #pBody::-webkit-scrollbar { width: 5px; }
  #pBody::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }
  #pButtons { display: flex; gap: 12px; margin-top: clamp(18px, 2vw, 30px); }
  #pButtons .btn { flex: 1; min-height: 48px; font-size: clamp(12px, 0.85vw, 14px);
                   display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; }
  #pButtons .btn img { width: 26px; height: 26px; object-fit: contain; }

  #pIcons { position: absolute; top: clamp(70px, 6vw, 92px); right: clamp(16px, 1.4vw, 24px);
            display: flex; flex-direction: column; gap: 12px; }
  .iconBtn { width: 70px; height: 70px; border-radius: 12px; cursor: pointer; position: relative;
             background: linear-gradient(160deg, rgba(20,36,58,0.9), rgba(9,17,30,0.9));
             border: 1px solid rgba(90,210,255,0.28); transition: all 0.22s var(--ease); }
  .iconBtn img { width: 76%; height: 76%; object-fit: contain; filter: brightness(0.92); }
  .iconBtn:hover { border-color: var(--accent); transform: translateX(-3px) scale(1.05);
                   box-shadow: 0 0 26px rgba(90,210,255,0.45); }
  .iconBtn:hover img { filter: brightness(1.15); }
  .iconBtn .lbl { position: absolute; right: 82px; top: 50%; transform: translateY(-50%) translateX(6px);
                  color: var(--accent); white-space: nowrap; opacity: 0; font-size: 12px;
                  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
                  transition: all 0.22s var(--ease); text-shadow: 0 0 14px rgba(90,210,255,0.6); }
  .iconBtn:hover .lbl { opacity: 1; transform: translateY(-50%) translateX(0); }

  /* ======================= STATUS LEDGER =======================
     A dedicated dashboard for the System status, in place of dumping the plugin's
     monospace body into the generic panel. All static (no running animations) so the
     view idles like the tree does. */
  .hidden { display: none !important; }

  #statCard { width: clamp(460px, 60vw, 840px); max-height: 88vh; border-radius: 4px;
              display: flex; flex-direction: column; gap: clamp(12px, 1.4vw, 18px);
              padding: clamp(20px, 2.4vw, 34px); }
  /* Header: the tier block on the left, the Skill Tree / Storage icon buttons stacked
     on the right — the same iconBtn look the dialog panel uses, which reads nicely here
     too. Flex (not absolute) so they never collide with the tier name or the brackets. */
  #sHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  #sHeadText { min-width: 0; }
  #sIcons { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  #sTierRow { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  #sTier { font-size: clamp(26px, 3.4vw, 44px); font-weight: 700; letter-spacing: 0.1em;
           color: #fff; text-shadow: 0 0 22px rgba(90,210,255,0.5); }
  .badge { padding: 3px 11px; border: 1px solid var(--line); border-radius: 20px;
           font-size: 11px; letter-spacing: 0.2em; color: var(--accent); align-self: center; }
  .badge.dormant { color: var(--amber); border-color: rgba(224,168,96,0.5); }
  #sAwaken { color: var(--amber); font-size: 12px; letter-spacing: 0.1em; margin-top: 6px; }
  #sCustom { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; margin-top: 6px; }
  #sCustom b { color: var(--accent); font-weight: 600; }

  #sTiles { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.2vw, 16px); }
  .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;
          padding: clamp(12px, 1.4vw, 18px); }
  .tLabel { color: var(--dim); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; }
  .tVal { margin-top: 8px; font-size: clamp(20px, 2.4vw, 30px); color: var(--text); }
  .tVal b { color: var(--accent); }
  .tVal span { color: var(--dim); font-size: 0.6em; }
  .bar { margin-top: 11px; height: 5px; background: rgba(90,210,255,0.14); border-radius: 3px;
         overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0;
           background: linear-gradient(90deg, var(--accent-dk), var(--accent)); }

  .sect { font-size: 11px; margin-bottom: 8px; }
  #sAtt { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .att { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px;
         border: 1px solid var(--line); border-radius: 3px; background: rgba(90,210,255,0.05);
         font-size: 13px; }
  .att .aName { color: var(--dim); }
  .att b { color: var(--accent); }

  #sTitleSect { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* flex:1 + min-height:0 are BOTH needed: without min-height:0 a flex item keeps its
     full content height (min-height:auto), so with all ~79 titles the list would grow
     past the card instead of scrolling inside it. This is what keeps the menu bounded. */
  #sTitles { flex: 1; min-height: 0; overflow-y: auto;
             display: flex; flex-direction: column; gap: 4px; padding-right: 6px; }
  #sTitles::-webkit-scrollbar { width: 5px; }
  #sTitles::-webkit-scrollbar-thumb { background: rgba(90,210,255,0.3); border-radius: 3px; }
  .trow { display: grid; grid-template-columns: 1.1fr 1.2fr 1fr; gap: 10px; padding: 8px 12px;
          border-left: 2px solid var(--line); background: rgba(9,18,33,0.4); font-size: 12.5px; }
  .trow .tName { color: var(--accent); }
  .trow .tEff { color: var(--text); }
  .trow .tQuest { color: var(--dim); text-align: right; }
  .trow.empty { grid-template-columns: 1fr; color: var(--dim); }

  #sFoot { border-top: 1px solid var(--line); padding-top: clamp(12px, 1.4vw, 18px); }
  #sActions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  #sActions .btn { padding: 10px 22px; font-size: 13px; }
  #sActions .btn.amber { border-color: rgba(224,168,96,0.5); color: var(--amber); }
  #sActions .btn.amber:hover { border-color: var(--amber); color: #fff;
                               box-shadow: 0 0 18px rgba(224,168,96,0.3); }
  #sActions .btn.amber.armed { border-color: var(--amber); color: #fff;
                               background: rgba(224,168,96,0.14); }

  /* ======================= LEVEL-UP FLOURISH =======================
     This plays over LIVE gameplay (the view is shown without focus, nothing is paused),
     so every layer animates transform/opacity ONLY — no width (forces layout) and no
     filter/blur (forces a re-raster), which the earlier version still did. */
  #screen-flourish { pointer-events: none; }
  #flourish { text-align: center; position: relative; }

  /* 1 — impact flash */
  #fFlash { position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse 55% 45% at 50% 50%,
                rgba(200,245,255,0.55), rgba(90,210,255,0.16) 42%, transparent 72%); }

  /* 2 — a shaft of light rising behind the text.
     Radial gradients ONLY: a linear-gradient fades along one axis but stays solid to the
     element's left and right edges, which showed up as a hard-edged rectangle early in
     the animation. Ellipses fall off in every direction, so there is no edge to see. */
  #fPillar { position: absolute; left: 50%; top: 50%; width: 520px; height: 380px;
    margin: -190px 0 0 -260px; opacity: 0;
    background: radial-gradient(ellipse 26% 62% at 50% 50%, rgba(170,238,255,0.34), transparent 70%),
                radial-gradient(ellipse 44% 100% at 50% 50%, rgba(90,210,255,0.20), transparent 72%); }

  /* 2b — a burst of light rays through the centre */
  .ray { position: absolute; left: 50%; top: 50%; width: 3px; height: 200px;
         margin: -100px 0 0 -1.5px; opacity: 0; transform-origin: 50% 50%;
         background: linear-gradient(180deg, transparent, rgba(165,235,255,0.85) 50%, transparent); }

  /* 3 — shockwaves: two rings and a diamond, staggered */
  .ring { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
          border: 2px solid rgba(90,210,255,0.7); border-radius: 50%; opacity: 0; }
  .ring.dia { border-radius: 0; border-color: rgba(200,245,255,0.55); }

  /* 4 — sparks; angle/distance/delay come from JS as custom properties */
  #fSparks { position: absolute; inset: 0; }
  .spark { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px;
           border-radius: 50%; background: #bdefff; box-shadow: 0 0 9px var(--accent); opacity: 0; }

  /* 5 — the title slams in letter by letter (each glyph is its own span) */
  #fTitleWrap { position: relative; display: inline-block; }
  .fT { font-size: clamp(38px, 4.6vw, 76px); font-weight: 800; letter-spacing: 0.16em;
        white-space: nowrap; }
  #fTitle { color: #fff;
            text-shadow: 0 0 14px #fff, 0 0 44px var(--accent), 0 0 95px var(--accent-dk); }
  .ltr { display: inline-block; opacity: 0; }

  #fSub { font-size: clamp(14px, 1.3vw, 22px); letter-spacing: 0.42em; color: var(--accent);
          margin-top: 16px; text-transform: uppercase; text-shadow: 0 0 22px rgba(90,210,255,0.7); }
  #fBar { height: 1px; width: 320px; margin: 22px auto 0; transform: scaleX(0); opacity: 0;
          background: linear-gradient(90deg, transparent, var(--accent), transparent); }

  /* --- timeline (everything is done by ~2.2s; the plugin hides the view at 2.4s) --- */
  #screen-flourish.play #fFlash   { animation: flash 0.5s ease-out both; }
  #screen-flourish.play #fPillar  { animation: pillar 1.6s var(--ease) both; }
  #screen-flourish.play .ray      { animation: ray 0.9s ease-out both; animation-delay: var(--rd); }
  #screen-flourish.play .ring     { animation: ring 1.5s ease-out both; }
  #screen-flourish.play .r2       { animation-delay: 0.15s !important; }
  #screen-flourish.play .r3       { animation-delay: 0.62s !important; }
  #screen-flourish.play .dia      { animation: ringDia 1.7s ease-out 0.28s both; }
  #screen-flourish.play .spark    { animation: spark 1.1s ease-out both; animation-delay: var(--sd); }
  #screen-flourish.play .ltr      { animation: ltrIn 0.5s cubic-bezier(.16,1.5,.3,1) both; }
  #screen-flourish.play #fSub     { animation: fadeup 0.55s var(--ease) 0.34s both; }
  #screen-flourish.play #fBar     { animation: bar 0.7s var(--ease) 0.4s both; }
  #screen-flourish.play #flourish { animation: fadeout 0.6s ease-in 1.8s both; }

  @keyframes flash   { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pillar  { 0% { opacity: 0; transform: scaleY(0.12); }
                       20% { opacity: 1; transform: scaleY(1); }
                       100% { opacity: 0; transform: scaleY(1.08); } }
  @keyframes ring    { 0% { transform: scale(0.2); opacity: 0.9; }
                       100% { transform: scale(26); opacity: 0; } }
  @keyframes ringDia { 0% { transform: rotate(45deg) scale(0.2); opacity: 0.75; }
                       100% { transform: rotate(45deg) scale(20); opacity: 0; } }
  @keyframes spark   { 0% { opacity: 1; transform: rotate(var(--a)) translateX(24px) scale(1); }
                       100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(0.35); } }
  @keyframes ray     { 0% { opacity: 0; transform: rotate(var(--a)) scaleY(0.12); }
                       22% { opacity: 0.95; }
                       100% { opacity: 0; transform: rotate(var(--a)) scaleY(2.6); } }
  @keyframes ltrIn   { 0% { opacity: 0; transform: translateY(-30px) scale(1.9) rotate(-7deg); }
                       55% { opacity: 1; }
                       100% { opacity: 1; transform: none; } }
  @keyframes fadeup  { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bar     { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; transform: scale(1.05); } }
</style>
</head>
<body>

        <div id="tTitle" class="eyebrow mono">System · Skill Tree</div>

        </div>

      <div id="tRule" class="rule"></div>

  <!-- STATUS LEDGER -->

      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="sHead">
        <div id="sHeadText">
          <div class="eyebrow mono">System · Status</div>
          <div id="sTierRow">
            <div id="sTier" class="mono">—</div>
            <div id="sMode" class="badge mono hidden"></div>
          </div>
          <div id="sAwaken" class="mono hidden"></div>
          <div id="sCustom" class="mono hidden"></div>
        </div>
        <div id="sIcons"></div>
      </div>
      <div class="rule"></div>
      <div id="sTiles">
        <div class="tile">
          <div class="tLabel mono">Milestones</div>
          <div class="tVal mono"><b id="sMile">—</b><span id="sMileTot"></span></div>
          <div class="bar"><i id="sBar"></i></div>

          <div class="tLabel mono">System Points</div>

        </div>
      </div>
      <div id="sAttSect">
        <div class="sect eyebrow mono">Attunements</div>
        <div id="sAtt"></div>

        <div class="sect eyebrow mono">Titles</div>
        <div id="sTitles"></div>

  <!-- LEVEL-UP FLOURISH -->
  <div id="screen-flourish" class="screen">
    <div id="fFlash"></div>
    <div id="fPillar"></div>
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="ring r3"></div><div class="ring dia"></div>
    <div id="fSparks"></div>
    <div id="flourish">
      <div id="fTitleWrap">
        <div id="fTitle" class="fT mono"></div>
      </div>
      <div id="fSub" class="mono"></div>
      <div id="fBar"></div>
    </div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const DESIGN_W = 1120, DESIGN_H = 760;   // the scaled stage
const NODE_R = 31;                       // half a node box, in canvas px
const RAIL = 130;                        // utility-rail width + gap, reserved on the left

/* Utility nodes are the repeatable, prerequisite-free upgrades. They live in the left
   rail, not the branch graph, so they're excluded from the graph layout. */
const isUtil = (n) => n.repeatable && !n.prereq[0] && !n.prereq[1];

function showScreen(name) {
  ["tree", "panel", "flourish", "status"].forEach(s => $("screen-" + s).classList.toggle("active", s === name));
}

/* Scale the fixed tree canvas to the viewport — shrink freely, but never blow it up
   past a comfortable size (the old min(vw/W, vh/H) reached ~1.9x on a 1440p screen
   and the panel filled the entire display). */
function fitTree() {
  const s = Math.min(window.innerWidth * 0.92 / DESIGN_W,
                     window.innerHeight * 0.82 / DESIGN_H, 1.55);
  document.documentElement.style.setProperty("--scale", s.toFixed(4));
}

/* ---------------- SKILL TREE ---------------- */
let TREE = { points: 0, perks: 0, perkMax: 255, nodes: [] };
const byKey = new Map();

/* Fit the graph to whatever the canvas measures: derive the extents from the data
   rather than hardcoding them, scale uniformly (never stretch) and centre. That keeps
   the layout balanced and stops the leftmost column hugging the frame. */
function layout() {
  const canvas = $("canvas");
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const graph = TREE.nodes.filter(n => !isUtil(n));
  if (!graph.length || !W || !H) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  graph.forEach(n => {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
  });
  const cw = Math.max(1, maxX - minX), ch = Math.max(1, maxY - minY);
  const pad = NODE_R + 24;
  const availW = W - RAIL;                       // graph lives right of the utility rail
  const k = Math.min((availW - pad * 2) / cw, (H - pad * 2) / ch);
  return { k, W, H,
           ox: RAIL + (availW - cw * k) / 2 - minX * k,
           oy: (H - ch * k) / 2 - minY * k };
}
const posOf = (L, n) => ({ x: L.ox + n.x * L.k, y: L.oy + n.y * L.k });

/* Pull point a toward b so lines stop at the tile edge instead of running underneath. */
function trimTo(a, b, r) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: a.x + dx / len * r, y: a.y + dy / len * r };
}

function stateOf(n) {
  if (n.owned) return "owned";
  const reachable = n.prereqMet && n.tierMet;
  if (reachable && TREE.points >= n.cost) return "buyable";
  if (reachable) return "poor";
  if (!n.tierMet) return "sealed";
  return "locked";
}
function statusOf(n) {
  const tag = n.repeatable ? " · Rank " + n.rank + (n.maxRank > 0 ? "/" + n.maxRank : "") : "";
  if (n.repeatable && n.maxRank > 0 && n.rank >= n.maxRank) return { t: "Maxed" + tag, c: "var(--accent)" };
  if (n.owned) return { t: "Unlocked", c: "var(--accent)" };
  if (!n.tierMet) return {
    // A dormant blessing seals by level, not by the rebirth you chose.
    t: n.reqLevel ? "Sealed — awakens at level " + n.reqLevel
                  : "Sealed — needs " + n.reqPower + " rebirth",
    c: "var(--amber)"
  };
  if (!n.prereqMet) return { t: "Locked — needs a connected node", c: "var(--dim)" };
  const ok = TREE.points >= n.cost;
  return { t: n.cost + " system point(s)" + tag, c: ok ? "var(--accent)" : "var(--danger)" };
}

let hoverKey = 0;

function showTip(n, el) {
  if (!n || !el) return;
  hoverKey = n.key;
  const tip = $("tip");
  $("tipName").textContent = n.name;
  $("tipDesc").textContent = n.desc;
  const s = statusOf(n);
  $("tipStatus").textContent = s.t;
  $("tipStatus").style.color = s.c;
  // Position from the element's actual box (works for graph nodes AND rail nodes,
  // whose positions come from flex layout, not inline left/top). Flip before it runs
  // off the right edge.
  const canvas = $("canvas"), cr = canvas.getBoundingClientRect(), er = el.getBoundingClientRect();
  const cx = er.left - cr.left + er.width / 2, cy = er.top - cr.top + er.height / 2;
  const flip = cx > canvas.clientWidth - 330;
  tip.style.left = (flip ? cx - 316 - 26 : cx + 42) + "px";
  tip.style.top = Math.max(4, cy - 40) + "px";
  tip.classList.add("show");
}
function hideTip() { hoverKey = 0; $("tip").classList.remove("show"); }

const STATES = ["owned", "buyable", "poor", "sealed", "locked"];
const nodeEls = new Map();   // node key -> element, kept across refreshes
let builtFor = "";           // which node set is currently in the DOM

/* Refreshes never tear the graph down — buying a node used to rebuild every element,
   which replayed the staggered entrance animation and made the whole tree blink. */
function renderTree() {
  $("hPoints").textContent = TREE.points;
  $("hPerks").textContent = TREE.perks + " / " + TREE.perkMax;
  renderRespec();

  const L = layout();
  if (!L) return;

  byKey.clear();
  TREE.nodes.forEach(n => byKey.set(n.key, n));

  const canvas = $("canvas");
  const sig = TREE.nodes.map(n => n.key).join(",");
  if (sig !== builtFor) {                    // different tree -> start clean
    [...canvas.querySelectorAll(".node")].forEach(e => e.remove());
    nodeEls.clear();
  }

  // --- connections (cheap to rebuild; there are only a handful) ---
  const svg = $("lines");
  svg.setAttribute("viewBox", "0 0 " + L.W + " " + L.H);
  svg.innerHTML = "";
  const addLine = (a, b, cls) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
    el.setAttribute("class", "lnk " + cls);
    svg.appendChild(el);
  };
  TREE.nodes.forEach(n => (n.prereq || []).forEach(pk => {
    if (!pk) return;
    const from = byKey.get(pk); if (!from) return;
    const p = posOf(L, from), q = posOf(L, n);
    const a = trimTo(p, q, NODE_R + 5), b = trimTo(q, p, NODE_R + 5);
    if (from.owned && n.owned) { addLine(a, b, "halo"); addLine(a, b, "on"); }
    else                        { addLine(a, b, from.owned ? "half" : "off"); }
  }));

  // --- nodes: create once, then update in place ---
  TREE.nodes.forEach((n, i) => {
    const util = isUtil(n);
    let el = nodeEls.get(n.key);
    if (!el) {
      el = document.createElement("div");
      el.className = util ? "node docked" : "node";
      el.style.animationDelay = (i * 20) + "ms";
      const img = document.createElement("img");
      img.src = "icons/" + n.icon;
      img.onerror = () => { img.style.display = "none"; };
      el.appendChild(img);
      el.addEventListener("mouseenter", () => showTip(byKey.get(n.key), el));
      el.addEventListener("mouseleave", hideTip);
      el.addEventListener("click", () => {
        const cur = byKey.get(n.key);
        if (cur && stateOf(cur) === "buyable") callBack("isekaiBuy", String(n.key));
      });
      (util ? $("urailNodes") : canvas).appendChild(el);
      nodeEls.set(n.key, el);
    }

    // Swap only the state class, so .node's entrance animation is never restarted.
    STATES.forEach(s => el.classList.remove(s));
    el.classList.add(stateOf(n));

    if (!util) {                     // rail nodes are placed by flex, not coordinates
      const p = posOf(L, n);
      el.style.left = p.x + "px";
      el.style.top = p.y + "px";
    }

    let pip = el.querySelector(".rank");
    if (n.repeatable && n.rank > 0) {
      if (!pip) { pip = document.createElement("div"); pip.className = "rank"; el.appendChild(pip); }
      pip.textContent = n.rank;
    } else if (pip) {
      pip.remove();
    }
  });

  builtFor = sig;

  // Keep the tooltip alive across a refresh: after buying, the cursor is still on the
  // node, so re-render its card with the new state instead of letting it vanish.
  if (hoverKey && nodeEls.has(hoverKey) && byKey.has(hoverKey)) {
    showTip(byKey.get(hoverKey), nodeEls.get(hoverKey));
  }
}

window.isekaiShowTree = (data) => {
  try { TREE = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  const wasOpen = $("screen-tree").classList.contains("active");
  showScreen("tree");
  if (!wasOpen) hideTip();             // a refresh keeps whatever the cursor is on
  fitTree();
  requestAnimationFrame(renderTree);   // let the stage lay out before measuring the canvas
};
function closeTree() { callBack("isekaiCloseTree", ""); }

/* Respec: two-click confirm instead of a nested dialog. The first press arms the
   button, a second within 3s commits; anything else disarms it. */
let respecArmed = 0;
function renderRespec() {
  const btn = $("tRespec");
  const amount = TREE.respec || 0;
  btn.classList.toggle("hidden", amount <= 0);
  if (amount <= 0) { respecArmed = 0; btn.classList.remove("armed"); return; }
  btn.classList.toggle("armed", !!respecArmed);
  btn.textContent = respecArmed ? "Confirm?" : "Respec  +" + amount;
  btn.title = "Refunds the System Points spent on stat nodes.\n"
            + "Knowledge unlocks and Perk Synthesis stay — the System cannot "
            + "un-teach what you already know.";
}
function respecClick() {
  if (respecArmed) {
    clearTimeout(respecArmed);
    respecArmed = 0;
    callBack("isekaiRespec", "");
  } else {
    respecArmed = setTimeout(() => { respecArmed = 0; renderRespec(); }, 3000);
  }
  renderRespec();
}

/* ---------------- DIALOG PANEL ---------------- */
let PANEL = { title: "", body: "", reveal: 45, width: 720, buttons: [] };
let panelRAF = 0, panelStart = 0, buttonsShown = false;

function textButtons() { return PANEL.buttons.filter(b => !b.iconOnly); }

function buildButtons() {
  const row = $("pButtons"); row.innerHTML = "";
  const icons = $("pIcons"); icons.innerHTML = "";
  PANEL.buttons.forEach((b, i) => {
    const el = document.createElement("button");
    if (b.iconOnly) {
      el.className = "iconBtn";
      el.innerHTML = '<span class="lbl">' + esc(b.label) + "</span>" +
                     (b.icon ? '<img src="icons/' + b.icon + '">' : "");
      icons.appendChild(el);
    } else {
      el.className = "btn mono";
      el.innerHTML = (b.icon ? '<img src="icons/' + b.icon + '">' : "") + esc(b.label);
      row.appendChild(el);
    }
    el.onclick = () => choose(i);
  });
  row.style.visibility = "hidden";
}
function tickPanel(now) {
  if (!panelStart) panelStart = now;
  const shown = Math.floor((now - panelStart) / 1000 * PANEL.reveal);
  const done = shown >= PANEL.body.length;
  $("pBody").textContent = done ? PANEL.body : PANEL.body.slice(0, shown) + "▌";
  if (done && !buttonsShown) { buttonsShown = true; $("pButtons").style.visibility = "visible"; }
  if (!done) panelRAF = requestAnimationFrame(tickPanel);
}
window.isekaiShowPanel = (data) => {
  try { PANEL = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("panel");
  $("pTitle").textContent = PANEL.title;
  document.documentElement.style.setProperty("--pw", (PANEL.width || 720) + "px");
  buildButtons();
  cancelAnimationFrame(panelRAF); panelStart = 0; buttonsShown = false;
  $("pBody").textContent = "";
  panelRAF = requestAnimationFrame(tickPanel);
};
function choose(i) { callBack("isekaiChoose", String(i)); }

/* ---------------- STATUS LEDGER ---------------- */
let STATUS = {};
let rebootArmed = 0;

function statusAction(a) { callBack("isekaiStatusAction", a); }

/* Reboot needs a deliberate second press, same idea as respec — it re-opens the whole
   blessing choice, so a stray click shouldn't fire it. */
function rebootClick(btn) {
  if (rebootArmed) {
    clearTimeout(rebootArmed); rebootArmed = 0;
    statusAction("reboot");
    return;
  }
  btn.classList.add("armed");
  btn.textContent = "Confirm reboot?";
  rebootArmed = setTimeout(() => {
    rebootArmed = 0; btn.classList.remove("armed"); btn.textContent = "Reboot";
  }, 3000);
}

function buildStatusActions() {
  const icons = $("sIcons"); icons.innerHTML = "";
  const box = $("sActions"); box.innerHTML = ""; rebootArmed = 0;

  // Skill Tree / Storage as the top-right icon buttons; Reboot / Close as footer text.
  const addIcon = (label, img, onClick) => {
    const b = document.createElement("button");
    b.className = "iconBtn";
    b.innerHTML = '<span class="lbl">' + esc(label) + "</span>"
                + '<img src="icons/' + img + '" onerror="this.style.display=\'none\'">';
    b.onclick = onClick; icons.appendChild(b);
  };
  const addBtn = (label, cls, onClick) => {
    const b = document.createElement("button");
    b.className = "btn mono" + (cls ? " " + cls : "");
    b.textContent = label; b.onclick = onClick; box.appendChild(b); return b;
  };

  if (STATUS.hasTree)    addIcon("Skill Tree", "spells_38_frame.png", () => statusAction("tree"));
  if (STATUS.hasStorage) addIcon("Storage", "spells_03_frame.png", () => statusAction("storage"));
  if (STATUS.canReboot)  { const rb = addBtn("Reboot", "amber", () => rebootClick(rb)); }
  addBtn("Close", "", () => statusAction("close"));
}

function renderStatus() {
  const s = STATUS;
  $("sTier").textContent = s.tier || "NORMAL";

  const mode = s.mode || "";
  const mb = $("sMode");
  mb.textContent = mode;
  mb.classList.toggle("hidden", !mode);
  mb.classList.toggle("dormant", mode === "DORMANT");

  const aw = $("sAwaken");
  if (s.nextAwakening > 0) { aw.textContent = "Awakens at level " + s.nextAwakening; aw.classList.remove("hidden"); }
  else aw.classList.add("hidden");

  // A CUSTOM build's three dials rarely agree, so spell them out under the header.
  const cu = $("sCustom");
  if (mode === "CUSTOM") {
    cu.innerHTML = "Rewards <b>" + esc(s.rewardTier || s.tier) + "</b> · "
                 + "Tree <b>" + esc(s.treeTier || s.tier) + "</b> · "
                 + "Gift <b>" + esc(s.grantTier || "NORMAL") + "</b>";
    cu.classList.remove("hidden");
  } else {
    cu.classList.add("hidden");
  }

  const earned = s.milestonesEarned || 0, total = s.milestonesTotal || 0;
  $("sMile").textContent = earned;
  $("sMileTot").textContent = " / " + total;
  $("sBar").style.width = (total ? Math.round(100 * earned / total) : 0) + "%";
  $("sPts").textContent = s.points || 0;

  const at = $("sAtt"); at.innerHTML = "";
  (s.attunements || []).forEach(a => {
    const d = document.createElement("div"); d.className = "att mono";
    d.innerHTML = '<span class="aName">' + esc(a.stat) + '</span><b>+' + a.amount + "</b>";
    at.appendChild(d);
  });
  $("sAttSect").classList.toggle("hidden", !(s.attunements || []).length);

  const tl = $("sTitles"); tl.innerHTML = "";
  const titles = s.titles || [];
  if (titles.length) {
    titles.forEach(t => {
      const d = document.createElement("div"); d.className = "trow mono";
      d.innerHTML = '<span class="tName">' + esc(t.name) + "</span>"
                  + '<span class="tEff">' + esc(t.effect) + "</span>"
                  + '<span class="tQuest">' + esc(t.quest) + "</span>";
      tl.appendChild(d);
    });
  } else {
    const d = document.createElement("div"); d.className = "trow mono empty";
    d.textContent = "No deeds recognised yet.";
    tl.appendChild(d);
  }

  buildStatusActions();
}

window.isekaiShowStatus = (data) => {
  try { STATUS = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) { return; }
  showScreen("status");
  renderStatus();
};

/* ---------------- LEVEL-UP FLOURISH ---------------- */
/* The burst layer (rays + sparks) is built once and reused. Each element carries its own
   angle / distance / delay as custom properties, so one keyframe can fling them all out
   individually instead of in lockstep. */
function buildBurst() {
  const box = $("fSparks");
  if (box.childElementCount) return;

  const RAYS = 10;
  for (let i = 0; i < RAYS; i++) {
    const r = document.createElement("div");
    r.className = "ray";
    r.style.setProperty("--a", (i * (180 / RAYS) + Math.random() * 8).toFixed(1) + "deg");
    r.style.setProperty("--rd", (Math.random() * 0.07).toFixed(3) + "s");
    box.appendChild(r);
  }

  const SPARKS = 16;
  for (let i = 0; i < SPARKS; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.setProperty("--a", (i * (360 / SPARKS) + Math.random() * 14 - 7).toFixed(1) + "deg");
    s.style.setProperty("--d", (170 + Math.random() * 190).toFixed(0) + "px");
    s.style.setProperty("--sd", (Math.random() * 0.18).toFixed(2) + "s");
    box.appendChild(s);
  }
}

/* Each glyph becomes its own span so the title can land letter by letter. */
function setFlourishTitle(a_text) {
  const el = $("fTitle");
  el.innerHTML = "";
  [...a_text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = "ltr";
    s.textContent = ch === " " ? " " : ch;
    s.style.animationDelay = (i * 0.038).toFixed(3) + "s";
    el.appendChild(s);
  });
}

window.isekaiFlourish = (data) => {
  let d = {}; try { d = (typeof data === "string") ? JSON.parse(data) : data; } catch (e) {}
  setFlourishTitle(d.title || "");
  $("fSub").textContent = d.subtitle || "";
  buildBurst();
  showScreen("flourish");
  const el = $("screen-flourish");
  el.classList.remove("play"); void el.offsetWidth; el.classList.add("play");
};

/* ---------------- shared ---------------- */
function callBack(name, arg) { if (window[name]) window[name](arg); }
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

window.addEventListener("resize", () => {
  fitTree();
  if ($("screen-tree").classList.contains("active")) renderTree();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("screen-tree").classList.contains("active")) { closeTree(); return; }
  if ($("screen-status").classList.contains("active")) { statusAction("close"); return; }
  if ($("screen-panel").classList.contains("active")) {
    const tb = textButtons();
    if (tb.length === 1) choose(PANEL.buttons.indexOf(tb[0]));
  }
});
fitTree();
</script>
