<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isekai Hero — Hud</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* ============================================================================
     The hud view: toasts, the level-up flourish and the threat labels.
     ----------------------------------------------------------------------------
     A click-through Magelight view that never closes (spec 9): Popup layer, Hud
     layer as the fallback, head-locked in VR. It plays over live gameplay, so:
       - Only transform and opacity animate (tools/check.mjs holds every transition
         and keyframe here to that). A page with nothing on it is an empty,
         transparent layer that Ultralight does not repaint.
       - Nothing loops. Every animation ends, and every timer ends with it.
       - Nothing depends on a frame tick. Toasts and the flourish arrive from any
         thread, also while the game is paused (a purchase toast over the shop), and
         age on CSS animations and plain timers.
     No light cone or beam anywhere (user look ruling, spec 7.1).
     ========================================================================== */

  html, body { pointer-events: none; }

  /* ======================= TOASTS =======================
     Top centre, just under the compass and clear of the crosshair, as the ImGui strip
     sat. Each toast is a projected strip: no box, a shade that dissolves into the scene
     at both ends and a hairline in the tone under it, so it reads as the System's
     status line and never as a dialog parked over a fight. A banner (an announcement:
     a new objective, a payout) is larger, has a hairline over it too, and its text is
     in the tone with the title fringe.

     The outer element plays the rise, the inner one the fade at the end of the life;
     their opacities multiply, so neither has to know about the other. The fade's
     delay is the toast's life minus the fade and comes from the script, which owns
     the timings. */
  #toasts {
    position: fixed; left: 0; right: 0; top: 11.5vh;
    display: flex; flex-direction: column; align-items: center;
    transform: scale(var(--ui-scale, 1)); transform-origin: 50% 0;
  }
  .toast { margin-bottom: 7px; max-width: 82vw; animation: toast-rise 220ms var(--ease) both; }
  .toast .tin {
    position: relative; display: flex; align-items: baseline; justify-content: center;
    padding: 6px 46px 8px;
    white-space: pre; overflow: hidden; text-overflow: ellipsis;
    font-size: 19px; color: var(--text);
    text-shadow: 0 1px 2px rgba(0, 6, 12, .95), 0 0 9px rgba(0, 6, 12, .7);
    background: linear-gradient(90deg, rgba(3, 11, 19, 0), rgba(3, 11, 19, .46) 22%,
                                       rgba(3, 11, 19, .46) 78%, rgba(3, 11, 19, 0));
    animation: toast-fade 800ms ease-in both;
  }
  /* The hairlines: the tone, fading out to nothing at both ends like the shade. */
  .toast .tin::after, .toast.banner .tin::before {
    content: ""; position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, rgba(var(--tone-rgb), 0), rgba(var(--tone-rgb), .75) 30%,
                                       rgba(var(--tone-rgb), .75) 70%, rgba(var(--tone-rgb), 0));
  }
  .toast .tin::after { bottom: 0; }
  .toast.banner .tin::before { top: 0; }
  /* "[ SYSTEM ]" and its kin, when a text opens with one: the System's own voice, in
     the tone and the mono face, set apart from what it says. */
  .toast .tg { flex: none; margin-right: 14px; font-size: 13px; letter-spacing: 3px; color: var(--tone); }
  .toast .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .toast.banner .tin {
    padding: 9px 60px 10px; font-size: 23px; letter-spacing: 1px;
    background: linear-gradient(90deg, rgba(3, 11, 19, 0), rgba(3, 11, 19, .58) 20%,
                                       rgba(3, 11, 19, .58) 80%, rgba(3, 11, 19, 0));
  }
  .toast.banner .tx { color: var(--tone); text-shadow: var(--proj-fringe), 0 1px 2px rgba(0, 6, 12, .95), 0 0 12px rgba(0, 6, 12, .7); }
  .toast.banner .tg { font-size: 14px; }

  @keyframes toast-rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes toast-fade {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* ======================= FLOURISH =======================
     Gold, centred a little above the middle, non-interactive, gone on its own. Built
     fresh for every play (a retrigger replaces it and starts over), so no animation
     ever has to be rewound. Three shockwave rings and a diamond expand from the
     centre (each element is drawn at its final size and scaled up into it, so the
     stroke ends thin rather than swelling), the screen's edges pulse once, the title
     lands letter by letter with an overshoot, the subtitle and a rule rise under it,
     and everything fades together over the last 0.7 s (the delay comes from the
     script). */
  #flourishLayer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  .fl { position: absolute; top: 0; right: 0; bottom: 0; left: 0; animation: fl-out 700ms ease-in both; }
  .fl-vig {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: radial-gradient(ellipse 75% 70% at 50% 42%, rgba(var(--tone-rgb), 0) 55%,
                                rgba(var(--tone-rgb), .2) 85%, rgba(var(--tone-rgb), .32));
    animation: fl-pulse 1.3s ease-out both;
  }
  .fl-c { position: absolute; left: 50%; top: 42%; width: 0; height: 0; transform: scale(var(--ui-scale, 1)); }
  .fl-ring {
    position: absolute; left: -45vh; top: -45vh; width: 90vh; height: 90vh; border-radius: 50%;
    border: 2px solid rgba(var(--tone-rgb), .75);
    box-shadow: 0 0 16px rgba(var(--tone-rgb), .35), inset 0 0 16px rgba(var(--tone-rgb), .2);
    animation: fl-ring 1.4s cubic-bezier(.15, .7, .3, 1) both;
  }
  .fl-ring.r2 { animation-delay: .18s; border-color: rgba(var(--tone-rgb), .5); }
  .fl-ring.r3 { animation-delay: .36s; border-color: rgba(var(--tone-rgb), .32); }
  .fl-dia {
    position: absolute; left: -26vh; top: -26vh; width: 52vh; height: 52vh;
    border: 1px solid rgba(var(--tone-rgb), .6);
    animation: fl-dia 1.6s cubic-bezier(.15, .7, .3, 1) .1s both;
  }
  .fl-txt { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
  .fl-title {
    font-family: var(--font-text); font-weight: 700; font-size: 66px; letter-spacing: .16em;
    color: var(--tone); padding-left: .16em;   /* the last letter's spacing, so it centres */
    text-shadow: 0 0 14px rgba(var(--tone-rgb), .75), 0 0 42px rgba(var(--tone-rgb), .45),
                 var(--proj-fringe), 0 2px 3px rgba(0, 6, 12, .8);
  }
  .fl-title .ltr { display: inline-block; animation: fl-ltr 500ms cubic-bezier(.16, 1.5, .3, 1) both; }
  .fl-title .sp { display: inline-block; width: .38em; }
  .fl-sub {
    margin-top: 12px; padding-left: .42em;
    font-family: var(--font-mono); font-size: 19px; letter-spacing: .42em; text-transform: uppercase;
    color: var(--text); text-shadow: 0 0 14px rgba(var(--tone-rgb), .6), 0 1px 2px rgba(0, 6, 12, .9);
    animation: fl-up 550ms var(--ease) .34s both;
  }
  .fl-bar {
    width: 360px; height: 1px; margin: 18px auto 0;
    background: linear-gradient(90deg, rgba(var(--tone-rgb), 0), var(--tone), rgba(var(--tone-rgb), 0));
    box-shadow: 0 0 8px rgba(var(--tone-rgb), .6);
    animation: fl-bar 700ms var(--ease) .4s both;
  }

  @keyframes fl-out   { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fl-pulse { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes fl-ring  { 0% { opacity: .95; transform: scale(.04); } 100% { opacity: 0; transform: scale(1); } }
  @keyframes fl-dia   { 0% { opacity: .8; transform: rotate(45deg) scale(.05); }
                        100% { opacity: 0; transform: rotate(45deg) scale(1); } }
  @keyframes fl-ltr   { 0% { opacity: 0; transform: translateY(-26px) scale(1.8); }
                        55% { opacity: 1; }
                        100% { opacity: 1; transform: none; } }
  @keyframes fl-up    { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fl-bar   { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }

  /* ======================= THREAT LABELS (flat screens) =======================
     One frame per actor, pinned by its bottom centre to the head point and growing
     upward. The content follows the ImGui frame the 0.8.0 feedback produced: one line
     (level, name, health figures, verdict word) over one bar, and the bar is the only
     coloured element besides the word — red is lethal, not low health. Magicka and
     stamina are a dimmer hairline under it, in the colours every MMO uses, only when
     the actor has them. Text is outlined by its shadow rather than backed by a plate,
     so the frame never becomes a box; two corner ticks at the bar's ends are the
     projection's bracket in miniature.

     The outer .lab is a zero-size point at the page's top left that labels.pos moves
     with ONE transform (translate to the head point, scale by distance and UiScale) —
     per frame nothing else is written. The frame inside is static: anchored to that
     point by its bottom centre. */
  #labels { position: fixed; top: 0; left: 0; width: 0; height: 0; transition: opacity 120ms ease-out; }
  /* No call for 300 ms: the game stopped ticking (free camera, a pause) and the labels
     would freeze over a world that moves on. Hidden until the next call. */
  #labels.stale { opacity: 0; }
  .lab { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
  .lab.off { display: none; }
  .lf {
    position: absolute; left: 0; bottom: 0; transform: translateX(-50%);
    min-width: 140px; white-space: nowrap; color: var(--text);
    /* An outline, not a blur: four hard one-pixel shadows and a soft halo. Labels sit over
       armour, stone, fur and snow, and a soft shadow alone loses the small type there. */
    --outline: -1px 0 rgba(2, 6, 10, .9), 1px 0 rgba(2, 6, 10, .9), 0 -1px rgba(2, 6, 10, .9),
               0 1px rgba(2, 6, 10, .9), 0 0 6px rgba(2, 6, 10, .7);
    text-shadow: var(--outline);
  }
  .lf .row { display: flex; align-items: baseline; }
  .lf .lv { flex: none; margin-right: 9px; font-size: 12px; color: var(--dim); }
  .lf .nm { flex: 0 1 auto; min-width: 0; max-width: 250px; overflow: hidden; text-overflow: ellipsis;
            font-size: 18px; font-weight: 600; letter-spacing: .3px; }
  .lf .hp { flex: none; margin-left: 8px; font-size: 12px; color: var(--dim); }
  .lf .tag { flex: none; margin-left: auto; padding-left: 12px; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: var(--tone); }
  .lf .bar { margin-top: 3px; background: rgba(3, 11, 19, .62); box-shadow: inset 0 0 0 1px rgba(var(--tone-rgb), .14); }
  /* Corner ticks: the bracket of the projected windows, at the ends of the bar. */
  .lf::before, .lf::after {
    content: ""; position: absolute; bottom: -3px; width: 6px; height: 6px; border: 1px solid var(--tone); opacity: .8;
  }
  .lf::before { left: -4px; border-right: 0; border-top: 0; }
  .lf::after  { right: -4px; border-left: 0; border-top: 0; }
  .lf.res::before, .lf.res::after { bottom: -7px; }
  .lf .rs { display: none; margin-top: 2px; height: 3px; }
  .lf.res .rs { display: flex; }
  .lf .rs > div { position: relative; flex: 1 1 0; overflow: hidden; background: rgba(3, 11, 19, .62); }
  .lf .rs > div + div { margin-left: 4px; }   /* touching, two fills read as one bar changing colour */
  .lf .rs > div.off { display: none; }
  .lf .rs i {
    position: absolute; top: 0; left: 0; bottom: 0; width: 100%;
    transform-origin: 0 50%; transform: scaleX(0); transition: transform 380ms var(--ease);
  }
  .lf .rs .mp i { background: rgba(77, 155, 255, .8); }
  .lf .rs .sp i { background: rgba(92, 230, 107, .75); }
  /* Verdicts within the tone: lethal burns brighter than dangerous (both red, as
     Logic::ToneFor says), trivial is the same cyan held back. */
  .lf[data-verdict="lethal"] .tag { font-weight: 700; }
  .lf[data-verdict="lethal"] .bar > i { box-shadow: 0 0 10px rgba(var(--tone-rgb), .9); }
  .lf[data-verdict="trivial"] .tag { color: var(--dim); }
  .lf[data-verdict="trivial"] .bar > i { opacity: .5; box-shadow: none; }
  .lf[data-verdict="trivial"]::before, .lf[data-verdict="trivial"]::after { opacity: .35; }

  /* ======================= THREAT LABELS (VR: the scan list) =======================
     Magelight cannot pin an element over each moving actor in a headset, so in VR the
     same frames stack into a head-locked list in the upper right, most dangerous first
     (spec 8). The list is a small projected window; the frames inside are the flat
     frames, laid out in flow instead of placed. Order is a flex order, set on a full
     push only. */
  #scanTitle { display: none; }
  body.vr #labels {
    top: 7vh; left: auto; right: 4vw; width: 440px; height: auto;
    display: flex; flex-direction: column;
    padding: 12px 18px 16px;
    background-color: var(--proj-shade);
    background-image: var(--proj-scan), linear-gradient(var(--proj-fill), var(--proj-fill));
    border: 1px solid var(--proj-border); box-shadow: var(--proj-glow);
    transform: scale(var(--ui-scale, 1)); transform-origin: 100% 0;
  }
  body.vr #labels::before, body.vr #labels::after {
    content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--tone);
  }
  body.vr #labels::before { left: -4px; top: -4px; border-right: 0; border-bottom: 0; }
  body.vr #labels::after  { right: -4px; bottom: -4px; border-left: 0; border-top: 0; }
  body.vr #labels.none { opacity: 0; }
  body.vr #scanTitle { display: flex; order: -1; margin-bottom: 4px; }
  body.vr .lab { position: relative; width: auto; height: auto; margin-top: 14px; transform: none !important; opacity: 1 !important; will-change: auto; }
  body.vr .lab.off { display: none; }
  body.vr .lf { position: relative; transform: none; min-width: 0; }
  body.vr .lf .nm { max-width: none; flex: 1 1 auto; }

  /* VR: the flourish sits higher, in the upper field of view (spec 8). */
  body.vr .fl-c { top: 32%; }

  @media (prefers-reduced-motion: reduce) {
    .fl-ring, .fl-dia, .fl-vig { display: none; }
  }
</style>
</head>
<body>
  <div id="flourishLayer"></div>
  <div id="labels" class="none">
    <div class="proj-title" id="scanTitle">
      <span class="slashes">//</span><span class="name" data-loc="view.hud.scan">Scan</span><span class="rule"></span>
    </div>
  </div>
  <div id="toasts"></div>

<!-- The build id (generated next to the pages by the build). A missing file must not
     stop the page: it then reports "dev". -->
<script src="version.js" onerror="window.console && console.warn('version.js missing; the page reports build dev')"></script>
<script src="common.js"></script>
<script>
"use strict";
/* ============================================================================
   Plugin entry points (src/UI/Magelight.cpp, through InvokeJS on the hud view):

     isekai.loc(table)    the translation table        (also later: re-renders)
     isekai.scale(s)      UiScale                      (also later: re-renders)
     isekai.vr(on)        threat labels as a scan list
     isekai.hello()       re-send isekai.ready (after a reload)
     isekai.toast({text, key, banner, tone})
     isekai.flourish({title, subtitle})
     isekai.labels.full([{id, x, y, s, level, name, tag, verdict, tone,
                          hp:[now,max], mp:[now,max], sp:[now,max], nums}])
     isekai.labels.pos([[id, x, y, s], ...])
     isekai.labels.keep()

   Labels: x, y are the head point in 0..1 of the view (y down); s is the DISTANCE
   factor alone (1 − 0.32·t, t = distance / range), the page multiplies UiScale in and
   dims with distance (1 − 0.35·t) as the ImGui frame did. verdict is the
   Logic::Verdict name ("lethal" …) or its number; tone is the plugin's tone and wins
   when it is one the page knows, else the page derives it from the verdict exactly as
   Logic::ToneFor(Verdict) does (tools/check.mjs runs verdictTone against UiLogic.h).
   tag is the verdict word, already translated. mp/sp show only with max > 0; nums:
   false hides the health figures (ThreatLabelNumbers off), the bar stays.

   Liveness: PlayerCharacter::Update, which pushes labels, does not run in free camera
   or while paused. Any labels.* call (full, pos, keep) is a sign of life; with none
   for 300 ms every label is hidden, and the next call shows them again. keep() is the
   heartbeat the plugin sends while labels are up and nothing moved. full([]) clears.

   The page sends isekai.ready (with its build id) and nothing else, ever.
   ========================================================================== */
(function () {
  const ui = window.isekaiUi;
  const t = ui.t;
  const $ = (id) => document.getElementById(id);
  const TONES = { cyan: 1, gold: 1, red: 1, violet: 1 };

  /* Values from a call are JSON literals from C++; a string is parsed (the playground
     and a hand-typed console call may send one). */
  function parse(v) {
    if (typeof v !== "string") return v;
    try { return JSON.parse(v); } catch (e) { console.warn("[isekai] hud: bad payload"); return null; }
  }

  /* ======================= toasts ======================= */
  const LINE_MS = 3200, BANNER_MS = 5500, FADE_MS = 800, MAX_TOASTS = 4;
  const toastBox = $("toasts");
  const toastByKey = Object.create(null);

  function dropToast(el) {
    clearTimeout(el.isekaiTimer);
    if (el.parentNode) el.parentNode.removeChild(el);
    if (el.isekaiKey && toastByKey[el.isekaiKey] === el) delete toastByKey[el.isekaiKey];
  }

  function buildToast(text, banner, tone, life) {
    const el = document.createElement("div");
    el.className = "toast " + (banner ? "banner" : "line");
    el.setAttribute("data-tone", tone);
    const tin = document.createElement("div");
    tin.className = "tin";
    tin.style.animationDelay = (life - FADE_MS) + "ms";
    // A leading "[ SYSTEM ]" (any short bracketed tag) is the System's voice: set apart.
    const m = /^\s*(\[[^\]\n]{1,24}\])\s*([\s\S]*)$/.exec(text);
    if (m && m[2]) {
      const tg = document.createElement("span");
      tg.className = "tg mono";
      tg.textContent = m[1];
      tin.appendChild(tg);
      text = m[2];
    }
    const tx = document.createElement("span");
    tx.className = "tx";
    tx.textContent = text;
    tin.appendChild(tx);
    el.appendChild(tin);
    return el;
  }

  /* A toast with a key already on screen replaces it in its slot and starts over (rise
     included, as the ImGui strip did): twenty kills leave one counter counting up.
     A fresh element rather than a rewound one, so restarting needs no style read. */
  function toast(payload) {
    const d = parse(payload);
    if (!d || typeof d !== "object") return;
    const text = d.text == null ? "" : String(d.text);
    if (!text.trim()) return;
    const banner = !!d.banner;
    const life = banner ? BANNER_MS : LINE_MS;
    const key = d.key ? String(d.key) : "";
    const el = buildToast(text, banner, TONES[d.tone] ? d.tone : "cyan", life);

    const old = key ? toastByKey[key] : null;
    if (old && old.parentNode === toastBox) {
      clearTimeout(old.isekaiTimer);
      toastBox.replaceChild(el, old);
    } else {
      toastBox.appendChild(el);
      // More than four at once stops being a status line and becomes a wall: the
      // oldest goes, the newest is what the player cares about.
      while (toastBox.children.length > MAX_TOASTS) dropToast(toastBox.firstElementChild);
    }
    if (key) { el.isekaiKey = key; toastByKey[key] = el; }
    el.isekaiTimer = setTimeout(() => dropToast(el), life);
  }

  /* ======================= flourish ======================= */
  const FLOURISH_MS = 3200, FLOURISH_FADE_MS = 700;
  const flLayer = $("flourishLayer");
  let flEl = null, flTimer = 0;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function flourish(payload) {
    const d = parse(payload);
    if (!d || typeof d !== "object") return;
    const title = d.title == null ? "" : String(d.title);
    const sub = d.subtitle == null ? "" : String(d.subtitle);

    const root = el("div", "fl");
    root.setAttribute("data-tone", "gold");
    root.style.animationDelay = (FLOURISH_MS - FLOURISH_FADE_MS) + "ms";
    root.appendChild(el("div", "fl-vig"));
    const c = el("div", "fl-c");
    c.appendChild(el("div", "fl-ring"));
    c.appendChild(el("div", "fl-ring r2"));
    c.appendChild(el("div", "fl-ring r3"));
    c.appendChild(el("div", "fl-dia"));
    const txt = el("div", "fl-txt");
    const ttl = el("div", "fl-title");
    // Letter by letter, each landing 38 ms after the one before. A title too long for
    // that is one block (it would take longer to land than to read).
    const chars = Array.from(title);
    if (chars.length <= 32) {
      chars.forEach((ch, i) => {
        const s = ch === " " ? el("span", "sp") : el("span", "ltr", ch);
        s.style.animationDelay = (i * 38) + "ms";
        ttl.appendChild(s);
      });
    } else {
      ttl.appendChild(el("span", "ltr", title));
    }
    txt.appendChild(ttl);
    if (sub) txt.appendChild(el("div", "fl-sub", sub));
    txt.appendChild(el("div", "fl-bar"));
    c.appendChild(txt);
    root.appendChild(c);

    // A retrigger restarts it rather than stacking a second one.
    clearTimeout(flTimer);
    if (flEl && flEl.parentNode) flEl.parentNode.removeChild(flEl);
    flLayer.appendChild(root);
    flEl = root;
    flTimer = setTimeout(() => {
      if (root.parentNode) root.parentNode.removeChild(root);
      if (flEl === root) flEl = null;
    }, FLOURISH_MS);
  }

  /* ======================= threat labels ======================= */
  const MAX_LABELS = 12, STALE_MS = 300;

  /* Logic::Verdict, in the enum's order (the number a plugin may send is its index). */
  const VERDICTS = ["trivial", "manageable", "dangerous", "lethal"];
  function verdictName(v) {
    if (typeof v === "number") return VERDICTS[v] || "manageable";
    const s = String(v == null ? "" : v).toLowerCase();
    return VERDICTS.indexOf(s) >= 0 ? s : "manageable";
  }
  /* Mirrors Logic::ToneFor(Verdict): dangerous and lethal are red, the rest cyan. */
  function verdictTone(v) {
    const n = verdictName(v);
    return (n === "dangerous" || n === "lethal") ? "red" : "cyan";
  }
  function labelTone(l) { return TONES[l.tone] ? l.tone : verdictTone(l.verdict); }
  const VERDICT_WORD = {
    lethal: () => t("threat.lethal", "LETHAL"),
    dangerous: () => t("threat.dangerous", "DANGEROUS"),
    manageable: () => t("threat.manageable", "MANAGEABLE"),
    trivial: () => t("threat.trivial", "TRIVIAL"),
  };
  /* Scan-list order: lethal first. */
  const SEVERITY = { lethal: 0, dangerous: 1, manageable: 2, trivial: 3 };

  const box = $("labels");
  const slots = [];            // pooled frames, at most MAX_LABELS, reused across pushes
  let byId = Object.create(null);
  let lastSet = [];            // the last full push, for re-renders (loc, scale, vr)
  let vr = false;
  let uiScale = 1;
  let W = window.innerWidth || 1, H = window.innerHeight || 1;

  // Liveness (see the header).
  let lastCall = 0, staleTimer = 0, stale = false, any = false;

  function makeSlot() {
    const s = { id: null, x: 0, y: 0, s: 1, a: -1, tone: "", verdict: "", res: "" };
    s.el = el("div", "lab off");
    s.frame = el("div", "lf");
    const row = el("div", "row");
    s.lv = el("span", "lv mono");
    s.nm = el("span", "nm");
    s.hp = el("span", "hp mono");
    s.tag = el("span", "tag mono");
    row.appendChild(s.lv); row.appendChild(s.nm); row.appendChild(s.hp); row.appendChild(s.tag);
    const bar = el("div", "bar");
    s.fill = el("i");
    bar.appendChild(s.fill);
    const rs = el("div", "rs");
    s.mpBox = el("div", "mp"); s.mpFill = el("i"); s.mpBox.appendChild(s.mpFill);
    s.spBox = el("div", "sp"); s.spFill = el("i"); s.spBox.appendChild(s.spFill);
    rs.appendChild(s.mpBox); rs.appendChild(s.spBox);
    s.frame.appendChild(row); s.frame.appendChild(bar); s.frame.appendChild(rs);
    s.el.appendChild(s.frame);
    box.appendChild(s.el);
    return s;
  }

  /* [now, max] → { now, max, f } or null (no such pool: max missing or 0). */
  function pool(v) {
    if (!v || typeof v.length !== "number" || v.length < 2) return null;
    const now = Number(v[0]), max = Number(v[1]);
    if (!(max > 0) || !isFinite(now)) return null;
    return { now: Math.round(now), max: Math.round(max), f: Math.min(Math.max(now / max, 0), 1) };
  }

  function setFill(i, f, fresh) {
    // A frame handed to a different actor must not slide from the last actor's health.
    i.style.transition = fresh ? "none" : "";
    i.style.transform = "scaleX(" + f.toFixed(3) + ")";
  }

  function fillSlot(s, l, fresh) {
    const tone = labelTone(l);
    const verdict = verdictName(l.verdict);
    if (s.tone !== tone) { s.tone = tone; s.frame.setAttribute("data-tone", tone); }
    if (s.verdict !== verdict) { s.verdict = verdict; s.frame.setAttribute("data-verdict", verdict); }
    const lvl = parseInt(l.level, 10);
    s.lv.textContent = isFinite(lvl) ? "LV " + lvl : "";
    s.nm.textContent = l.name ? String(l.name) : t("threat.unknown", "Unknown");
    s.tag.textContent = l.tag ? String(l.tag) : VERDICT_WORD[verdict]();

    const hp = pool(l.hp);
    s.hp.textContent = hp && l.nums !== false ? hp.now + " / " + hp.max : "";
    setFill(s.fill, hp ? hp.f : 1, fresh);

    const mp = pool(l.mp), sp = pool(l.sp);
    const res = (mp ? "m" : "") + (sp ? "s" : "");
    if (s.res !== res) {
      s.res = res;
      s.frame.classList.toggle("res", !!res);
      s.mpBox.classList.toggle("off", !mp);
      s.spBox.classList.toggle("off", !sp);
    }
    if (mp) setFill(s.mpFill, mp.f, fresh);
    if (sp) setFill(s.spFill, sp.f, fresh);
  }

  /* Distance dimming, as the ImGui frame: s = 1 − 0.32·t, alpha = 1 − 0.35·t. */
  function alphaFor(sc) {
    const td = Math.min(Math.max((1 - sc) / 0.32, 0), 1);
    return 1 - 0.35 * td;
  }

  /* THE per-frame write: one transform per label, an opacity only when it changed
     visibly. No layout read, no DOM creation, no class change (tools/check.mjs). */
  function place(s, x, y, sc) {
    s.x = +x || 0; s.y = +y || 0; s.s = sc > 0 ? +sc : 1;
    s.el.style.transform = "translate3d(" + (s.x * W).toFixed(1) + "px," + (s.y * H).toFixed(1) +
                           "px,0) scale(" + (s.s * uiScale).toFixed(3) + ")";
    const a = alphaFor(s.s);
    if (Math.abs(a - s.a) > 0.01) { s.a = a; s.el.style.opacity = a.toFixed(2); }
  }

  function alive() {
    lastCall = Date.now();
    if (stale) { stale = false; box.classList.remove("stale"); }
    if (any && !staleTimer) staleTimer = setTimeout(checkStale, STALE_MS);
  }

  function checkStale() {
    staleTimer = 0;
    if (!any) return;
    const left = STALE_MS - (Date.now() - lastCall);
    if (left > 0) { staleTimer = setTimeout(checkStale, left); return; }
    stale = true;
    box.classList.add("stale");
  }

  /* Draw lastSet: frames keep their actor across pushes (a label never jumps to another
     head), new actors take a free frame, the rest are switched off. fromPush: the set
     just arrived and its positions are current; otherwise (loc, scale, vr) a kept frame
     stays where the last labels.pos put it. */
  function render(fromPush) {
    const set = lastSet;
    const next = Object.create(null);
    set.forEach((l) => { const s = byId[l.id]; if (s && !next[l.id]) next[l.id] = s; });
    const kept = slots.filter((s) => s.id !== null && next[s.id] === s);
    const free = slots.filter((s) => kept.indexOf(s) < 0);
    const order = set.map((l, i) => ({ l: l, i: i }));
    if (vr) order.sort((a, b) => (SEVERITY[verdictName(a.l.verdict)] - SEVERITY[verdictName(b.l.verdict)]) || (a.i - b.i));

    order.forEach((o, rank) => {
      const l = o.l;
      let s = next[l.id], fresh = false;
      if (!s) {
        if (free.length) s = free.shift();
        else if (slots.length < MAX_LABELS) { s = makeSlot(); slots.push(s); }
        else return;
        next[l.id] = s;
        s.id = l.id;
        s.a = -1;
        fresh = true;
      }
      fillSlot(s, l, fresh);
      s.el.classList.remove("off");
      if (vr) {
        s.el.style.order = String(rank);
      } else {
        s.el.style.order = "";
        if (fromPush || fresh) place(s, l.x, l.y, l.s);
        else place(s, s.x, s.y, s.s);
      }
    });
    free.forEach((s) => { s.id = null; s.el.classList.add("off"); });
    byId = next;
    any = set.length > 0;
    box.classList.toggle("none", !any);
    if (!any) { clearTimeout(staleTimer); staleTimer = 0; }
  }

  function full(payload) {
    const d = parse(payload);
    const arr = (d && typeof d.length === "number") ? Array.prototype.slice.call(d, 0, MAX_LABELS) : [];
    lastSet = arr.filter((l) => l && typeof l === "object" && l.id != null);
    render(true);
    alive();
  }

  function pos(payload) {
    alive();
    if (vr) return;                      // the scan list has no positions
    const d = typeof payload === "string" ? parse(payload) : payload;
    if (!d) return;
    for (let i = 0; i < d.length; i++) {
      const e = d[i];
      const s = e && byId[e[0]];
      if (s) place(s, e[1], e[2], e[3]);
    }
  }

  function keep() { alive(); }

  function setVr(on) {
    vr = on === true || on === 1 || on === "1" || on === "true";
    document.body.classList.toggle("vr", vr);
    if (!vr) slots.forEach((s) => { s.a = -1; });
    render(false);
  }

  /* The view resized: the cached size moves every label to its new pixel position. */
  window.addEventListener("resize", () => {
    W = window.innerWidth || 1; H = window.innerHeight || 1;
    if (!vr) slots.forEach((s) => { if (s.id !== null) place(s, s.x, s.y, s.s); });
  });

  /* ======================= plugin entry points ======================= */
  window.isekai = {
    loc: (table) => { ui.setLoc(table); render(false); },
    scale: (s) => { uiScale = ui.setScale(s); render(false); },
    vr: (on) => setVr(on),
    hello: () => ui.ready(),
    toast: (p) => toast(p),
    flourish: (p) => flourish(p),
    labels: { full: full, pos: pos, keep: keep },
  };

  ui.applyLoc();
  ui.ready();
})();
</script>
</body>
</html>
