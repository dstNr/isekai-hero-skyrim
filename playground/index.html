<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Isekai Hero — Playground</title>
<style>
  /* ==========================================================================
     The playground fakes what Magelight gives the pages in game: a transparent
     view composited over a running scene. Here the "scene" is a painted
     backdrop (switchable, so legibility can be checked over dusk, snow and
     night), and the real system page is loaded in an iframe on top of it,
     driven by mock.js exactly as the SKSE plugin drives it.
     ========================================================================== */
  /* No color-scheme here: when the harness and the page declare different schemes,
     Chromium paints an opaque canvas behind the iframe and the "transparent" view
     turns into a grey sheet over the scene. */
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden;
               font-family: "Segoe UI", system-ui, sans-serif; }

  #scene { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  #scene.dusk {
    background:
      radial-gradient(60% 40% at 30% 92%, rgba(120, 140, 110, .35), transparent),
      radial-gradient(50% 30% at 80% 96%, rgba(90, 100, 120, .4), transparent),
      linear-gradient(180deg, #2b3440 0%, #1a1f26 60%, #12161b 100%);
  }
  #scene.snow {
    background:
      radial-gradient(70% 35% at 40% 95%, rgba(255, 255, 255, .9), transparent),
      radial-gradient(45% 25% at 85% 90%, rgba(220, 230, 240, .8), transparent),
      linear-gradient(180deg, #b9c7d4 0%, #dfe7ee 55%, #f4f7fa 100%);
  }
  #scene.night {
    background:
      radial-gradient(40% 25% at 70% 90%, rgba(200, 120, 50, .25), transparent),
      linear-gradient(180deg, #05080d 0%, #0b1017 70%, #10151c 100%);
  }

  /* The view, transparent-backed, exactly as Magelight composites it. */
  #view {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    background: transparent; transition: opacity .2s ease;
  }
  #view.is-hidden { opacity: 0; pointer-events: none; }

  /* --- control dock (not part of the mod; the playground's own chrome) --- */
  #dock {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    max-width: 700px; padding: 10px 12px;
    background: rgba(6, 10, 16, .86);
    border: 1px solid rgba(120, 160, 200, .22); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    font-size: 12px; color: #b9c6d6;
  }
  #dock.collapsed > :not(#btnDock) { display: none; }
  #dock strong { color: #7fd0ff; letter-spacing: .12em; font-size: 11px;
                 text-transform: uppercase; margin: 0 2px 0 6px; }
  #dock .sep { width: 100%; height: 0; }
  #dock button, #dock select {
    background: rgba(30, 46, 66, .7); color: #cfe0f0;
    border: 1px solid rgba(120, 160, 200, .3); border-radius: 5px;
    padding: 5px 9px; cursor: pointer; font: inherit;
  }
  #dock button:hover:not(:disabled) { border-color: #5ad2ff; color: #fff; }
  #dock button:disabled { opacity: .4; cursor: not-allowed; }
  #dock button.ghost { background: transparent; }
  #dock .pts { font-family: Consolas, monospace; color: #7fd0ff; }

  #log {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    width: 300px; max-height: 170px; overflow: auto; padding: 8px 10px;
    background: rgba(6, 10, 16, .86);
    border: 1px solid rgba(120, 160, 200, .22); border-radius: 8px;
    font-family: Consolas, monospace; font-size: 11px; color: #8aa8c4;
  }
  #log b { color: #7fd0ff; display: block; margin-bottom: 4px; letter-spacing: .1em; }
  #log div { opacity: .85; }
</style>
<!-- Before the iframe: the page's fake host forwards to IsekaiMock from its first line. -->
<script src="mock.js"></script>
</head>
<body>
  <div id="scene" class="dusk"></div>

  <!-- The real, unmodified system page, with the fake Magelight host injected by
       serve.mjs (?host=mock). Served over http so parent and iframe share an origin. -->
  <iframe id="view" class="is-hidden" src="/magelight/IsekaiHero/system.html?host=mock"
          allowtransparency="true"></iframe>

  <div id="dock">
    <button id="btnDock" class="ghost" title="Hide the dock for a clean screenshot">☰</button>
    <span id="scenarios"></span>
    <div class="sep"></div>

    <strong>Tone</strong>
    <select id="tone" title="Re-show the panel in another tone (in game C++ picks it)">
      <option value="">as sent</option>
      <option value="cyan">cyan</option>
      <option value="gold">gold</option>
      <option value="red">red</option>
      <option value="violet">violet</option>
    </select>
    <strong>Scene</strong>
    <select id="scene-pick">
      <option value="dusk">dusk</option>
      <option value="snow">snow (bright)</option>
      <option value="night">night</option>
    </select>
    <strong>Text</strong>
    <select id="lang"><option value="en">English</option><option value="de">Deutsch (partial)</option></select>
    <strong>UiScale</strong>
    <select id="scale">
      <option value="0.75">0.75</option><option value="1" selected>1</option>
      <option value="1.25">1.25</option><option value="1.5">1.5</option>
    </select>

    <div class="sep"></div>
    <strong>Points</strong>
    <button id="btnP10" class="ghost">+10</button>
    <span class="pts" id="ptsView">—</span>
    <strong>Rebirth</strong>
    <select id="tier">
      <option value="0">Normal</option><option value="1">Hero</option>
      <option value="2" selected>Ascended</option>
    </select>
    <label title="Sealed nodes name the level they awaken at instead of a rebirth">
      <input type="checkbox" id="dormant"> Dormant
    </label>
    <button id="btnReset" class="ghost">Reset</button>
    <span class="pts" id="build" title="The build id the page reported with isekai.ready"></span>
  </div>

  <div id="log"><b>Host traffic</b></div>

  <script>
    "use strict";
    var M = window.IsekaiMock;
    var frame = document.getElementById("view");
    var logEl = document.getElementById("log");
    var buttons = [];

    // mock.js reports host traffic here, so every round trip is visible.
    window.VS_LOG = function (msg) {
      var d = document.createElement("div");
      d.textContent = "▸ " + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    };

    // The screen picker, built from mock.js's scenarios. A screen the page has no
    // renderer for yet (isekai.screens) is listed but disabled.
    (function buildPicker() {
      var host = document.getElementById("scenarios");
      var group = "";
      M.SCENARIOS.forEach(function (s) {
        if (s.group !== group) {
          group = s.group;
          var g = document.createElement("strong");
          g.textContent = group;
          host.appendChild(g);
        }
        var b = document.createElement("button");
        b.textContent = s.label;
        b.title = s.hint || "";
        b.onclick = function (e) { M.open(s.id, e); };
        b.dataset.screen = s.screen || "panel";
        host.appendChild(b);
        buttons.push(b);
      });
      // The hud page (toasts, flourish, threat labels) previews here once it exists.
      var hud = document.createElement("button");
      hud.textContent = "Hud";
      hud.disabled = true;
      hud.title = "magelight/IsekaiHero/hud.html is not there yet";
      host.appendChild(hud);
      fetch("/magelight/IsekaiHero/hud.html", { method: "HEAD" }).then(function (r) {
        if (!r.ok) return;
        hud.disabled = false;
        hud.title = "Open the hud page";
        hud.onclick = function () { window.open("/magelight/IsekaiHero/hud.html?host=mock", "_blank"); };
      }).catch(function () {});
    })();

    function refresh() {
      var st = M.state();
      document.getElementById("ptsView").textContent = st.points;
      document.getElementById("build").textContent = st.ready ? "page " + st.build : "page not ready";
      buttons.forEach(function (b) {
        var screen = b.dataset.screen;
        b.disabled = screen !== "panel" && !M.supports(screen);
        if (b.disabled) b.title = "system.html has no '" + screen + "' screen yet";
      });
    }
    M.onChange(refresh);

    // Direct links for review and screenshots:
    //   ?open=<scenario id>&tone=<cyan|gold|red|violet>&scene=<dusk|snow|night>&dock=0
    //   &instant=1   panels arrive fully typed (a screenshot does not wait for the text)
    var Q = new URLSearchParams(location.search);
    if (Q.get("instant") === "1") M.setInstant(true);
    if (Q.get("scene")) {
      document.getElementById("scene").className = Q.get("scene");
      document.getElementById("scene-pick").value = Q.get("scene");
    }
    if (Q.get("tone")) { document.getElementById("tone").value = Q.get("tone"); M.setTone(Q.get("tone")); }
    if (Q.get("dock") === "0") {
      document.getElementById("dock").classList.add("collapsed");
      logEl.style.display = "none";
    }

    M.attach(frame);
    frame.addEventListener("load", function () {
      M.attach(frame);
      refresh();
      // A first look without clicking: the story panel, or the one asked for.
      if (!frame.dataset.opened) { frame.dataset.opened = "1"; M.open(Q.get("open") || "story"); }
    });

    document.getElementById("btnDock").onclick = function () {
      document.getElementById("dock").classList.toggle("collapsed");
    };
    document.getElementById("tone").onchange = function (e) { M.setTone(e.target.value); };
    document.getElementById("scene-pick").onchange = function (e) {
      document.getElementById("scene").className = e.target.value;
    };
    document.getElementById("lang").onchange = function (e) { M.setLang(e.target.value); };
    document.getElementById("scale").onchange = function (e) { M.setScale(parseFloat(e.target.value)); };
    document.getElementById("btnP10").onclick = function () { M.addPoints(10); };
    document.getElementById("tier").onchange = function (e) { M.setTier(parseInt(e.target.value, 10)); };
    document.getElementById("dormant").onchange = function (e) { M.setDormant(e.target.checked); };
    document.getElementById("btnReset").onclick = function () {
      M.reset();
      document.getElementById("tier").value = String(M.getTier());
      document.getElementById("dormant").checked = M.getDormant();
      logEl.innerHTML = "<b>Host traffic</b>";
    };
    refresh();
  </script>
</body>
</html>
