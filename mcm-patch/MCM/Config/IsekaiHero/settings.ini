; Defaults for the Mod Configuration Menu.
;
; MCM Helper reads this to know what "reset to default" means, and copies it to
; Data\MCM\Settings\IsekaiHero.ini the first time the menu is opened. It is NOT the file
; the mod reads: that is Data\SKSE\Plugins\IsekaiHero.ini, which keeps the long-form
; comments explaining every setting.
;
; These values must match the defaults in IsekaiHero.ini. If they drift, the MCM will
; offer to "reset" a setting to something the shipped ini never said.
;
; The names carry Bethesda's type prefixes (b, i, f) because MCM Helper stores them as
; engine settings, and the engine takes a setting's type from its first letter.

[Interface]
fUiScale=1.0
fTextSpeed=1.0
bHideSealedNodes=0
bAutoStart=1

[Hotkey]
iSystemMenuKey=31
iSystemMenuModifier=54
iThreatLabelKey=68

[Threat]
